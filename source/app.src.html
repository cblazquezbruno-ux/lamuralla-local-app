<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Muralla">
<meta name="description" content="La Muralla Local · Tu local por 390 € al mes. Solo 10 locales en Talavera de la Reina.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>La Muralla Local</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 700;font-display:swap;src:url(data:font/woff2;base64,__FONT__) format('woff2');}
__BASECSS__
/* ===== real-app additions ===== */
body{padding-top:env(safe-area-inset-top)}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.glow.drift{animation:drift 18s ease-in-out infinite alternate}
.glow.drift2{animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,-30px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-50px) scale(.9)}}
#splash{position:fixed;inset:0;z-index:200;background:var(--carbon);display:grid;place-items:center;transition:opacity .45s}
#splash img{width:84px;opacity:0;animation:sIn .35s .15s ease forwards}
#splash .glow.o{width:300px;height:300px;right:-120px;bottom:-60px;opacity:.45}
#splash .glow.v{width:220px;height:220px;right:40px;bottom:-120px;opacity:.3}
@keyframes sIn{to{opacity:1}}
#splash.out{opacity:0;pointer-events:none}
.stag>*{opacity:0;animation:fd .4s ease forwards}
.nostag .stag>*{animation:none;opacity:1}
.stag>*:nth-child(1){animation-delay:.02s}.stag>*:nth-child(2){animation-delay:.07s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.17s}.stag>*:nth-child(5){animation-delay:.22s}.stag>*:nth-child(6){animation-delay:.27s}.stag>*:nth-child(n+7){animation-delay:.3s}
/* landing hero */
.mega{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--naranja)}
.bigprice{display:flex;align-items:flex-start;gap:6px;margin-top:6px}
.bigprice b{font-size:112px;line-height:.82;letter-spacing:-.06em;font-weight:700}
.bigprice span{font-size:26px;font-weight:700;margin-top:6px}
.bigprice small{display:block;font-size:14px;color:var(--gris);font-weight:600;margin-top:2px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin:28px -20px 0;background:rgba(218,127,44,.06)}
.ticker div{display:inline-block;animation:tick 26s linear infinite;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#e6c7a8}
.ticker i{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--naranja);margin:0 14px 2px}
@keyframes tick{to{transform:translateX(-50%)}}
.slots10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.slots10 div{aspect-ratio:1;border-radius:14px;border:1px dashed #3a3b41;display:grid;place-items:center;font-weight:700;color:#55575e;font-size:15px;position:relative;overflow:hidden}
.slots10 div.on{border:1px solid var(--naranja);background:rgba(218,127,44,.16);color:var(--naranja2)}
.slots10 div.on:after{content:'';position:absolute;inset:auto 0 0 0;height:3px;background:var(--naranja)}
.photo-hero{position:relative;border-radius:22px;overflow:hidden;margin-top:24px}
.photo-hero img{width:100%;display:block;filter:grayscale(.15) contrast(1.05)}
.photo-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,18,20,0) 40%,rgba(17,18,20,.85))}
.photo-hero p{position:absolute;left:16px;bottom:14px;z-index:2;font-weight:700;font-size:15px}
/* ticket */
.ticket{position:relative;border-radius:24px;background:linear-gradient(150deg,#232428,#17181b 60%);border:1px solid #2e2f35;overflow:hidden}
.ticket .glow.o{width:240px;height:240px;right:-90px;top:-120px;opacity:.38}
.ticket .glow.v{width:160px;height:160px;right:40px;top:-110px;opacity:.25}
.ticket .tk-top{position:relative;z-index:2;padding:20px 20px 18px}
.ticket .tk-cut{position:relative;height:0;border-top:2px dashed #34353b;margin:0 22px}
.ticket .tk-cut:before,.ticket .tk-cut:after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--carbon);border:1px solid #2e2f35}
.ticket .tk-cut:before{left:-36px}.ticket .tk-cut:after{right:-36px}
.ticket .tk-bot{position:relative;z-index:2;padding:16px 20px 20px}
.tk-day{font-size:104px;font-weight:700;line-height:.8;letter-spacing:-.06em}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tk-meta div{font-size:12px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tk-meta b{display:block;color:var(--blanco);font-size:16px;letter-spacing:0;text-transform:none;margin-top:2px}
.barcode{height:34px;border-radius:4px;background:repeating-linear-gradient(90deg,#f4f4f4 0 2px,transparent 2px 4px,#f4f4f4 4px 5px,transparent 5px 8px,#f4f4f4 8px 11px,transparent 11px 12px);opacity:.85;flex:1}
.count{display:flex;gap:6px}
.count div{background:var(--carbon2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:46px}
.count b{display:block;font-size:18px;line-height:1}
.count small{font-size:10px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* chat */
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--gris2);text-transform:uppercase;letter-spacing:.08em;margin:6px 0}
.typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gris);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.msg{animation:fd .25s ease both}
.msg .t .rd{font-weight:700;margin-left:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:9px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#d6d7da}
.chathead{display:flex;align-items:center;gap:12px}
.online{width:9px;height:9px;border-radius:50%;background:#5fbf8f;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(95,191,143,.15)}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12px;color:var(--gris);font-weight:600}
.kpi.o{border-color:rgba(218,127,44,.5);background:linear-gradient(150deg,rgba(218,127,44,.14),var(--card))}
.search{position:relative}.search .ico{position:absolute;left:14px;top:15px;color:var(--gris2)}.search .inp{padding-left:44px}
.loading{opacity:.55;pointer-events:none}
.pp-box{margin-top:16px;min-height:50px}
.testtag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:#5c5f66;background:#e7e7e7;border-radius:8px;padding:4px 8px}
.install{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px dashed rgba(218,127,44,.55);background:rgba(218,127,44,.06)}
.err{color:#ef7f7b;font-size:13.5px;min-height:18px;margin-top:8px}
/*PREMIUM*/
/* ===================== PREMIUM LAYER ===================== */
:root{--navtop:92px}
.chatbar{bottom:var(--navtop)!important}
.chat{padding-bottom:calc(var(--navtop) + 74px)!important}
@media(min-width:500px){.chatbar{bottom:var(--navtop)!important}}
.topbar-l{display:flex;align-items:center;gap:10px}
.topback{width:40px;height:40px;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--blanco);animation:fd .25s ease both}

/* sheets: close button + drag */
.sheet-x{position:sticky;top:-10px;z-index:6;display:flex;justify-content:flex-end;height:0;pointer-events:none}
.sheet-x button{pointer-events:auto;margin-top:-4px;width:38px;height:38px;border-radius:50%;background:#26272c;border:1px solid #34353b;display:grid;place-items:center;color:var(--blanco)}
.sheet.dragging{transition:none!important}
.grab{cursor:grab;padding:8px 0;margin-top:-4px;box-sizing:content-box;background-clip:content-box}

/* nav: sliding pill + pop */
.nav-in{position:relative}
.nav-ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:16px;background:#2c2d33;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .5s cubic-bezier(.2,.9,.25,1.12),width .35s ease;z-index:0;pointer-events:none}
.nav button{z-index:1;background:transparent!important}
.nav button.on .ico{animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(.6) translateY(3px)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* press feedback */
.btn,.tile,.prep,.chip,.slot,.day,.pill,.nav button,.check,.quick button,.holo,.kpi{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.pressed{transform:scale(.96)!important}

/* CTA shimmer */
.btn.o,.btn.pp{position:relative;overflow:hidden;isolation:isolate}
.btn.o:after,.btn.pp:after{content:'';position:absolute;inset:-2px;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
.btn.o>*,.btn.pp>*{position:relative}
@keyframes sweep{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* holographic cards */
.holo-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 20px 26px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.holo-row::-webkit-scrollbar{display:none}
.holo{flex:none;width:214px;aspect-ratio:5/7.2;scroll-snap-align:center;perspective:1000px;cursor:pointer;-webkit-user-select:none;user-select:none}
.holo-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)))}
.holo.live .holo-in{transition:transform .12s linear}
.holo.flipped{--flip:180deg}
.holo-face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4)}
.holo-front{background:#ddd}
.holo-front img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(.98);transform:scale(1.06) translate(calc(var(--mx,0) * -6px),calc(var(--my,0) * -6px))}
.foil{position:absolute;inset:0;z-index:2;mix-blend-mode:color-dodge;opacity:.7;pointer-events:none;
  background:linear-gradient(115deg,transparent 18%,rgba(218,127,44,.75) 32%,rgba(232,149,74,.4) 40%,rgba(128,168,168,.75) 50%,rgba(244,244,244,.7) 58%,rgba(218,127,44,.5) 66%,transparent 80%);
  background-size:260% 260%;background-position:var(--px,50%) var(--py,50%);filter:saturate(1.3)}
.foil2{position:absolute;inset:0;z-index:2;opacity:.18;mix-blend-mode:overlay;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 4px)}
.glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at var(--px,50%) var(--py,25%),rgba(255,255,255,.75),rgba(255,255,255,.12) 28%,transparent 55%);mix-blend-mode:overlay}
.holo-cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(17,18,20,.95) 55%)}
.holo-cap b{display:block;font-size:21px;letter-spacing:-.02em;color:#fff}
.holo-cap span{font-size:11px;color:var(--gris);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.holo-chip{position:absolute;top:12px;left:12px;z-index:4;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:rgba(17,18,20,.7);backdrop-filter:blur(8px);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.holo-no{position:absolute;top:12px;right:12px;z-index:4;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);background:rgba(17,18,20,.55);padding:4px 8px;border-radius:8px}
.holo-back{transform:rotateY(180deg);background:linear-gradient(160deg,#232428,#121315);padding:18px;display:flex;flex-direction:column}
.holo-back .glow.o{width:180px;height:180px;right:-70px;bottom:-80px;opacity:.5}
.holo-back img.sym{width:34px;opacity:.9}
.flip-hint{font-size:11px;color:var(--gris2);text-align:center;margin-top:-12px}

/* ticket: foil + 3D flip */
.tk-flip{display:grid;perspective:1200px}
.tk-flip>.tk-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tk-flip .tk-back{transform:rotateY(180deg)}
.tk-flip.flipped .tk-front{transform:rotateY(-180deg)}
.tk-flip.flipped .tk-back{transform:rotateY(0)}
.ticket{transform:rotateX(calc(var(--rx,0deg)*.35)) rotateY(calc(var(--ry,0deg)*.35));transform-style:preserve-3d}
.ticket .foil{border-radius:24px;opacity:.38;mix-blend-mode:color-dodge}
.ticket .glare{border-radius:24px;opacity:.7}
.tk-flipbtn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:var(--gris)}
.qr{width:92px;height:92px;border-radius:12px;background:#f4f4f4;padding:7px;flex:none}
.tk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

/* dynamic island */
.island{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%) scale(.9);z-index:45;background:#000;color:#fff;border-radius:999px;padding:8px 16px 8px 9px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.2,.9,.25,1.18);border:1px solid #1d1d1f;white-space:nowrap}
.island.on{transform:translate(-50%,0) scale(1)}
.island .rec{width:26px;height:26px;border-radius:50%;background:var(--naranja);display:grid;place-items:center;color:#111}
.island .rec svg{width:15px;height:15px}
.island small{color:#9a9da4;font-weight:600;margin-left:2px}
.island .lv{width:7px;height:7px;border-radius:50%;background:#ff453a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* celebration: ticket printing */
.celebrate{position:fixed;inset:0;z-index:150;background:rgba(9,9,11,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease both;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.celebrate.out{animation:fadeOut .35s ease forwards}
@keyframes fadeOut{to{opacity:0}}
.printer{width:300px;height:26px;border-radius:14px;background:linear-gradient(#34353b,#202126);border:1px solid #45464d;position:relative;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.printer:after{content:'';position:absolute;left:18px;right:18px;bottom:6px;height:4px;border-radius:4px;background:#0b0b0c}
.printer i{position:absolute;right:14px;top:9px;width:7px;height:7px;border-radius:50%;background:#3ad07a;box-shadow:0 0 8px #3ad07a;animation:blink 0.5s 4}
.print-clip{width:268px;overflow:hidden;margin-top:-10px;padding-bottom:30px}
.print-ticket{transform:translateY(-104%);animation:printOut 1.6s .35s cubic-bezier(.35,.75,.25,1) forwards;background:var(--blanco);color:var(--carbon);border-radius:0 0 18px 18px;padding:26px 20px 20px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.print-ticket:before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,#d9d9d9 0 6px,transparent 6px 12px);opacity:.6}
@keyframes printOut{0%{transform:translateY(-104%)}70%{transform:translateY(-6%)}100%{transform:translateY(0)}}
.print-ticket .big{font-size:84px;font-weight:700;line-height:.85;letter-spacing:-.06em}
.print-ticket .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--naranja)}
.print-ticket .bc{height:30px;margin-top:14px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px)}
.cel-title{opacity:0;animation:fd .5s 1.7s ease forwards;text-align:center;margin-top:8px}
.cel-btn{opacity:0;animation:fd .5s 2s ease forwards;width:268px;margin-top:18px}
.bit{position:absolute;top:-20px;width:9px;height:9px;border-radius:2px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}

/* odometer */
.odo{display:inline-flex;align-items:flex-start;overflow:hidden;line-height:1;height:1em}
.od{display:inline-block;height:1em;overflow:hidden;position:relative}
.od-s{display:flex;flex-direction:column;transition:transform 1.1s cubic-bezier(.2,.85,.2,1)}
.od-s span{height:1em;line-height:1;display:block}

/* skeleton */
.sk{background:linear-gradient(100deg,#1d1e22 30%,#2a2b31 50%,#1d1e22 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:16px}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}

/* pull to refresh */
#ptr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:44;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#1d1e22;border:1px solid #33343a;display:grid;place-items:center;transform:translateY(-70px);opacity:0;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#ptr img{width:22px}
#ptr.spin img{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* swipe checklist */
.check{position:relative;touch-action:pan-y}
.check .txt{transition:color .2s}
.check.sw-go{background:linear-gradient(90deg,rgba(128,168,168,.18),transparent);border-radius:12px}

/* calendar day entrance */
.grid.anim .day{animation:dayIn .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes dayIn{from{opacity:0;transform:translateY(8px) scale(.92)}}
.day.sel{animation:selPop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes selPop{0%{transform:scale(.85)}100%{transform:scale(1)}}

/* sticky CTA landing */
.stickycta{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:calc(100% - 28px);max-width:412px;z-index:35;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:rgba(30,31,35,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #33343a;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:transform .5s cubic-bezier(.2,.9,.25,1.15)}
.stickycta.on{transform:translate(-50%,0)}
.stickycta b{font-size:16px}
.stickycta small{display:block;font-size:12px;color:var(--naranja2);font-weight:700}
.stickycta .btn{width:auto;min-height:46px;padding:0 18px;font-size:15px;border-radius:14px}

/* assistant */
.mode{display:flex;background:var(--carbon2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;position:relative}
.mode button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--gris);z-index:1;transition:color .2s}
.mode button.on{color:var(--blanco)}
.mode .mi{position:absolute;top:4px;bottom:4px;width:calc(50% - 6px);left:4px;border-radius:12px;background:var(--card2);transition:transform .45s cubic-bezier(.2,.9,.25,1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mode.bot .mi{transform:translateX(calc(100% + 4px))}
.botav{width:44px;height:44px;border-radius:14px;background:radial-gradient(circle at 30% 30%,#f0a560,var(--naranja) 60%,#a85a17);display:grid;place-items:center;box-shadow:0 8px 20px rgba(218,127,44,.35);position:relative;flex:none}

function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  if(!pushCapable()){toast('Este navegador no permite avisos');return}

  try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CFG.vapid)});
    const j=sub.toJSON();const{error}=await sb.from('push_subs').upsert({user_id:D.me.id,endpoint:j.endpoint,sub:j},{onConflict:'endpoint'});

function sheet(html,onMount){const had=!!$('#scrim');closeSheet(true);const d=document.createElement('div');d.className='scrim';d.id='scrim';

  d.addEventListener('click',e=>{if(e.target===d)sheetClose()});document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));document.body.style.overflow='hidden';
  if(!had)pushNav('sheet');
  const sh=d.querySelector('.sheet'),gr=d.querySelector('.grab');let y0=null,dy=0;
  const st=e=>{if(sh.scrollTop>0&&!e.target.closest('.grab'))return;y0=(e.touches?e.touches[0]:e).clientY;dy=0};
  const mv=e=>{if(y0===null)return;dy=(e.touches?e.touches[0]:e).clientY-y0;if(dy<=0){sh.style.transform='';return}sh.classList.add('dragging');sh.style.transform=`translateY(${dy}px)`};
  const en=()=>{if(y0===null)return;y0=null;sh.classList.remove('dragging');if(dy>110){sheetClose()}else sh.style.transform=''};
  gr.addEventListener('touchstart',st,{passive:true});sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0)st(e)},{passive:true});sh.addEventListener('touchmove',mv,{passive:true});sh.addEventListener('touchend',en);
  onMount&&onMount(d)}

/* ================= ACTIONS ================= */
async function rpc(fn,args){const{data,error}=await sb.rpc(fn,args);if(error){toast(error.message.replace(/^.*?: /,''));throw error}return data}
async function upd(table,patch,match){const q=sb.from(table).update(patch);Object.entries(match).forEach(([k,v])=>q.eq(k,v));const{error}=await q;if(error){toast(error.message);throw error}}
async function saveSettings(){const{error}=await sb.from('settings').update({data:D.settings,updated_at:new Date().toISOString()}).eq('id',1);if(error){toast(error.message);return}toast('Guardado')}
function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]]}o[p[p.length-1]]=val}
const A={
  toLogin(){go('login')},toLanding(){go('landing')},
  async enter(){await enterApp()},
  async logout(){closeSheet(true);if(rtChan)sb.removeChannel(rtChan);if(typeChan)sb.removeChannel(typeChan);rtChan=typeChan=null;await sb.auth.signOut();D.me=null;ui.calM=null;ui.selDay=null;ui.chatWith=null;go('landing')},
  startSignup(el){ui.signup=newSignup(el.dataset.pack);go('signup')},
  swapPack(){ui.signup.pack=ui.signup.pack==='imagen'?'completo':'imagen';render(true)},
  sBack(){if(ui.signup.step===0)go('landing');else{ui.signup.step--;render()}},
  sNext(){if(!signupValid())return;ui.signup.step++;render()},
  sSet(el){ui.signup.data[el.dataset.k]=el.dataset.v;render(true)},
  sTog(el){const a=ui.signup.data[el.dataset.k],v=el.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render(true)},
  sFlip(el){ui.signup.data[el.dataset.k]=!ui.signup.data[el.dataset.k];render(true)},
  paySignupTest(){const{p,tot}=signupAmounts();sheetPayTest(withIva(tot),'Primer mes · '+p.name,()=>finishSignup({mode:'prueba'}))},
  tab(el){if(ui.tab===el.dataset.t){window.scrollTo({top:0,behavior:'smooth'});return}const was=ui.tab;ui.tab=el.dataset.t;if(was==='inicio')pushNav('tab');else try{history.replaceState({lml:'tab'},'')}catch(e){}vt(()=>render())},atab(el){if(ui.atab===el.dataset.t&&!ui.chatWith)return;const was=ui.atab;ui.atab=el.dataset.t;ui.chatWith=null;if(typeChan){sb.removeChannel(typeChan);typeChan=null}if(was==='panel')pushNav('tab');vt(()=>render())},
  calNav(el){const k=el.dataset.mode==='admin'?'acalM':'calM';const[y,m]=ui[k].split('-').map(Number);ui[k]=ym(new Date(y,m-1+(+el.dataset.d),1));ui.selDay=null;ui.selSlot=null;ui.calAnim=true;render(true);ui.calAnim=false},
  pickDay(el){const k=el.dataset.d,mine=myB().find(b=>b.date===k);if(mine){toast(`Tu grabación: ${short(k)} · ${mine.slot}`);return}ui.selDay=k;const fs=freeSlots(k);ui.selSlot=fs.length===1?fs[0]:null;render(true);setTimeout(()=>$('#slots')?.scrollIntoView({behavior:'smooth',block:'center'}),60)},
  clearDay(){ui.selDay=null;ui.selSlot=null;render(true)},
  pickSlot(el){ui.selSlot=el.dataset.s;render(true)},
  async book(el){el.classList.add('loading');try{const bk={date:ui.selDay,slot:ui.selSlot};await rpc('book_slot',{p_date:ui.selDay,p_slot:ui.selSlot});ui.selDay=ui.selSlot=null;await loadAll();render();const real=myB().find(b=>b.date===bk.date)||bk;celebrate(real)}catch(e){el.classList.remove('loading');await loadAll();render(true)}},
  change(el){const from=el.dataset.from,b=myB().find(x=>x.date===from),to=ui.selDay,slot=ui.selSlot;
    sheet(`<span class="label">Cambiar grabación</span><h2 class="mt4">¿Seguro?</h2><div class="card mt16"><div class="line"><span class="l"><small>Antes</small><b style="text-decoration:line-through;opacity:.6">${nice(from)} · ${esc(b.slot)}</b></span></div><div class="line"><span class="l"><small>Ahora</small><b>${nice(to)} · ${esc(slot)}</b></span></div></div><button class="btn o mt16" id="cOk">Sí, cambiar</button><button class="btn outline sm mt8" data-act="closeSheet">Cancelar</button>`,d=>{d.querySelector('#cOk').onclick=async()=>{try{await rpc('book_slot',{p_date:to,p_slot:slot,p_replace:from});closeSheet(true);ui.selDay=ui.selSlot=null;await loadAll();await loadMe();render();toast('Grabación cambiada')}catch(e){closeSheet()}}})},
  async extraDay(el){try{await rpc('set_extra_days',{p_month:workMonth(),p_delta:+el.dataset.d});await loadAll();render(true);if(+el.dataset.d>0)toast('Día extra añadido. Elige el día en el calendario')}catch(e){}},
  openPrep(){sheetPrep()},
  async tick(el){const c=D.me,i=el.dataset.i,ch={...(c.checks||{})};ch[i]=!ch[i];c.checks=ch;el.classList.toggle('on');el.querySelector('.box').innerHTML=ch[i]?I('check','s'):'';await upd('profiles',{checks:ch},{id:c.id})},
  openEvent(){sheetEvent()},
  async sendEvent(){const t=$('#evT').value.trim(),x=$('#evX').value.trim(),d=$('#evD').value||null;if(!t||!x){toast('Pon un nombre y cuéntanos qué es');return}
    const{error}=await sb.from('events').insert({client_id:D.me.id,title:t,text:x,date:d});if(error){toast(error.message);return}closeSheet(true);await loadAll();render(true);toast(`Enviado. Te respondemos en menos de ${S().eventHours} h`)},
  async evResp(el){try{await rpc('respond_event',{p_id:el.dataset.id,p_accept:el.dataset.a==='1'});await loadAll();render(true);if(el.dataset.a==='1')toast('Presupuesto aceptado. Añadido a tu mes')}catch(e){}},
  payExtrasTest(){const m=workMonth();sheetPayTest(withIva(pendingExtras(m)),'Extras de '+monthName(m),async()=>{const{data,error}=await sb.functions.invoke('pay-extras',{body:{month:m}});const err=error?await errMsg(error):data?.error;if(err){toast(err);return false}await loadAll();render(true);return true})},
  openContent(){sheetContent()},
  async approve(){await upd('profiles',{approved:true},{id:D.me.id});D.me.approved=true;closeSheet();toast('Calendario aprobado')},
  askChanges(){closeSheet(true);ui.tab='chat';render();setTimeout(()=>{const i=$('#chatI');if(i){i.value='Hola, me gustaría cambiar: ';i.focus()}},80)},
  openUpgrade(){sheetUpgrade()},
  async reqUpgrade(){await sendMsg('Quiero pasarme al Pack Completo con el asistente IA.');closeSheet();toast('¡Hecho! Te escribimos por el chat')},
  openGoals(){sheetGoals()},openAccess(){sheetAccess()},openCancel(){sheetCancel()},
  pTog(el){const d=$('#scrim');const o=d._o,a=o[el.dataset.k]||(o[el.dataset.k]=[]),v=el.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);el.classList.toggle('on')},

/* --- haptics: Android vibrate + iOS switch trick (progresivo: si no hay, no pasa nada) --- */
let _hapEl=null;
function haptic(kind){
  try{if(navigator.vibrate){navigator.vibrate(kind==='ok'?[12,40,18]:10);return}}catch(e){}
  try{if(!_hapEl){const l=document.createElement('label');l.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);document.body.appendChild(l);_hapEl=l}
    _hapEl.click();if(kind==='ok')setTimeout(()=>_hapEl.click(),90)}catch(e){}
}
/* --- press feedback --- */
const PRESS='.btn,.tile,.prep,.chip,.slot,.day,.pill,.nav button,.check,.quick button,.kpi,.mode button,.tk-flipbtn,.topback';
document.addEventListener('pointerdown',e=>{const el=e.target.closest(PRESS);if(el&&!el.disabled)el.classList.add('pressed')},{passive:true});
['pointerup','pointercancel','pointerleave','dragstart'].forEach(ev=>document.addEventListener(ev,()=>document.querySelectorAll('.pressed').forEach(x=>x.classList.remove('pressed')),{passive:true}));
document.addEventListener('click',e=>{const el=e.target.closest('.nav button,.btn.o,.check,.slot,.day.av,.mode button,[data-act=book],[data-act=extraDay]');if(el)haptic()},true);

function measureNav(){const n=document.querySelector('.nav');const top=n?Math.max(0,window.innerHeight-n.getBoundingClientRect().top):0;document.documentElement.style.setProperty('--navtop',(top||0)+'px')}
window.addEventListener('resize',()=>{measureNav();placeNavInd(false)});
if(window.visualViewport)visualViewport.addEventListener('resize',measureNav);
let _navX=null,_navW=null;
function placeNavInd(animate=true){
  const nav=document.querySelector('.nav-in');if(!nav)return;const on=nav.querySelector('button.on');if(!on)return;
  let ind=nav.querySelector('.nav-ind');if(!ind){ind=document.createElement('i');ind.className='nav-ind';nav.prepend(ind)}
  const x=on.offsetLeft,w=on.offsetWidth;
  if(_navX!==null&&animate){ind.style.transition='none';ind.style.width=_navW+'px';ind.style.transform=`translateX(${_navX}px)`;ind.offsetWidth;ind.style.transition=''}
  requestAnimationFrame(()=>{ind.style.width=w+'px';ind.style.transform=`translateX(${x}px)`});_navX=x;_navW=w;
}

function canGoBack(){
  if(ui.view==='client')return ui.tab!=='inicio'||(ui.tab==='chat'&&ui.chatMode==='bot');
  if(ui.view==='admin')return !!ui.chatWith||ui.atab!=='panel';
  if(ui.view==='signup'||ui.view==='login')return true;
  return false;
}
function goBack(fromPop){
  if(ui.view==='client'){if(ui.tab==='chat'&&ui.chatMode==='bot'){ui.chatMode='team';render();return}if(ui.tab!=='inicio'){ui.tab='inicio';vt(()=>render());return}}
  else if(ui.view==='admin'){if(ui.chatWith){A.closeThread();return}if(ui.atab!=='panel'){ui.atab='panel';vt(()=>render());return}}
  else if(ui.view==='signup'){A.sBack();return}
  else if(ui.view==='login'){go('landing');return}
}

}
/* motor de inclinación: dedo + giroscopio, para .holo y .ticket */
let _gyroAsked=false,_gyro=null,_tiltRAF=null;
function askGyro(){if(_gyroAsked)return;_gyroAsked=true;try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')startGyro()}).catch(()=>{})}else startGyro()}catch(e){}}
function startGyro(){window.addEventListener('deviceorientation',e=>{if(e.beta==null)return;_gyro={x:Math.max(-1,Math.min(1,(e.gamma||0)/25)),y:Math.max(-1,Math.min(1,((e.beta||0)-45)/25))};if(!_tiltRAF)_tiltRAF=requestAnimationFrame(applyGyro)},{passive:true})}
function setTilt(el,x,y){ // x,y en -1..1
  el.style.setProperty('--ry',(x*14).toFixed(2)+'deg');el.style.setProperty('--rx',(-y*12).toFixed(2)+'deg');
  el.style.setProperty('--px',(50+x*45).toFixed(1)+'%');el.style.setProperty('--py',(50+y*45).toFixed(1)+'%');
  el.style.setProperty('--mx',x.toFixed(3));el.style.setProperty('--my',y.toFixed(3));
}
function applyGyro(){_tiltRAF=null;if(!_gyro)return;document.querySelectorAll('[data-holo]:not(.live) .holo-in,.ticket[data-tilt]').forEach(el=>setTilt(el,_gyro.x,_gyro.y))}
document.addEventListener('pointermove',e=>{const h=e.target.closest('[data-holo],.ticket[data-tilt]');if(!h)return;const tgt=h.matches('[data-holo]')?h.querySelector('.holo-in'):h;const r=h.getBoundingClientRect();const x=((e.clientX-r.left)/r.width)*2-1,y=((e.clientY-r.top)/r.height)*2-1;h.classList.add('live');setTilt(tgt,Math.max(-1,Math.min(1,x)),Math.max(-1,Math.min(1,y)))},{passive:true});
document.addEventListener('pointerout',e=>{const h=e.target.closest('[data-holo],.ticket[data-tilt]');if(!h||h.contains(e.relatedTarget))return;h.classList.remove('live');if(!_gyro){const tgt=h.matches('[data-holo]')?h.querySelector('.holo-in'):h;setTilt(tgt,0,0)}},{passive:true});
document.addEventListener('click',e=>{const h=e.target.closest('[data-holo]');if(!h)return;askGyro();if(e.target.closest('[data-act]'))return;h.classList.toggle('flipped');haptic()});

/* --- ticket: QR decorativo, .ics, giro --- */
function qrHTML(seed){let s=0;for(const ch of String(seed))s=(s*31+ch.charCodeAt(0))>>>0;const r=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296};
  let cells='';for(let y=0;y<11;y++)for(let x=0;x<11;x++){const corner=(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);const on=corner?((x%8===0||x%8===2||y%8===0||y%8===2)||(x%8===1&&y%8===1)):r()>.5;cells+=`<i style="background:${on?'#111214':'transparent'}"></i>`}
  return `<div class="qr" style="display:grid;grid-template-columns:repeat(11,1fr);gap:1px">${cells}</div>`}
function icsFor(b){const st=b.slot.slice(0,5).replace(':',''),en=b.slot.slice(-5).replace(':','');const d=b.date.replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//La Muralla//Local//ES','BEGIN:VEVENT',`UID:${b.id||d}@lamuralla`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;TZID=Europe/Madrid:${d}T${st}00`,`DTEND;TZID=Europe/Madrid:${d}T${en}00`,'SUMMARY:Rodaje La Muralla 🎬',`DESCRIPTION:Grabación de contenido en ${(D.me?.business||'tu local').replace(/[,;]/g,' ')}. Revisa «Qué necesitamos de ti» en la app.`,'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Mañana grabamos','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics)}

/* --- isla dinámica (cuenta atrás al hacer scroll) --- */
let _isl=null;
function islandUpdate(){
  const nb=(ui.view==='client'&&ui.tab==='inicio'&&D.me)?nextB():null;const tk=document.querySelector('.tk-flip,.hero');
  if(!_isl){_isl=document.createElement('button');_isl.className='island';_isl.onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});haptic()};document.body.appendChild(_isl)}
  if(!nb||!tk){_isl.classList.remove('on');return}
  const r=tk.getBoundingClientRect();const show=r.bottom<60;
  if(show){const d=parse(nb.date);const t=new Date(d);t.setHours(+nb.slot.slice(0,2),+nb.slot.slice(3,5));const ms=t-new Date();const dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5);
    _isl.innerHTML=`<span class="rec">${I('cam')}</span>Rodaje ${ms>0?`en ${dd?dd+'d ':''}${hh}h`:'hoy'}<small>· ${short(nb.date)}</small><span class="lv"></span>`}
  _isl.classList.toggle('on',show);
}
window.addEventListener('scroll',()=>{islandUpdate();stickyUpdate()},{passive:true});

/* --- CTA fija en la portada --- */
let _sticky=null;
function stickyUpdate(){
  if(!S())return;
  if(!_sticky){_sticky=document.createElement('div');_sticky.className='stickycta';document.body.appendChild(_sticky)}
  const show=ui.view==='landing'&&window.scrollY>520&&promoActive();
  if(show&&!_sticky.dataset.v){const p0=S().packs[0];_sticky.innerHTML=`<div style="flex:1"><b>Tu local por ${p0.promo} €</b><small>Quedan ${promoLeft()} de ${S().promoTotal} plazas</small></div><button class="btn o" data-act="startSignup" data-pack="imagen">Quiero mi plaza</button>`;_sticky.dataset.v=1}
  if(!show)delete _sticky.dataset.v;
  _sticky.classList.toggle('on',show);
}

/* --- celebración: ticket imprimiéndose --- */
function celebrate(b){
  haptic('ok');const d=parse(b.date);const cols=['#DA7F2C','#80A8A8','#F4F4F4','#e8954a'];
  let bits='';for(let i=0;i<46;i++){bits+=`<i class="bit" style="left:${Math.random()*100}%;background:${cols[i%4]};--dx:${(Math.random()*160-80).toFixed(0)}px;--rot:${(Math.random()*720-360).toFixed(0)}deg;animation-delay:${(1.5+Math.random()*.6).toFixed(2)}s;width:${6+Math.random()*6}px;height:${6+Math.random()*8}px"></i>`}
  const el=document.createElement('div');el.className='celebrate';
  el.innerHTML=`${bits}<div class="printer"><i></i></div><div class="print-clip"><div class="print-ticket">
    <div class="between"><span class="lab">Día de rodaje</span><img src="${IMG.icon}" style="width:22px;filter:brightness(0)" alt=""></div>
    <div class="row mt12" style="align-items:flex-end;gap:12px"><div class="big">${d.getDate()}</div><div><b style="font-size:18px">${cap(DIA[d.getDay()])}</b><div style="color:#555;font-size:14px">${cap(MES[d.getMonth()])} · ${esc(b.slot)}</div></div></div>
    <div style="margin-top:12px;font-size:13px;color:#555">${esc(D.me?.business||'')}</div><div class="bc"></div></div></div>
    <h2 class="cel-title">¡Rodaje confirmado!</h2><p class="small muted cel-title" style="animation-delay:1.85s">Te avisamos antes. Prepara lo que necesitamos.</p>
    <button class="btn o cel-btn" data-act="closeCelebrate">Genial</button>`;
  document.body.appendChild(el);pushNav('cel');
}
function closeCelebrate(){const el=document.querySelector('.celebrate');if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),350)}

/* --- odómetro para totales --- */
function odoHTML(v){return `<span class="odo" data-odo="${v}">${eur(v)}</span>`}
function runOdo(el){
  const v=num(el.dataset.odo),txt=eur(v);
  el.innerHTML=[...txt].map(ch=>/\d/.test(ch)?`<span class="od"><span class="od-s">${'0123456789'.split('').map(n=>`<span>${n}</span>`).join('')}</span></span>`:`<span>${ch===' '?'&nbsp;':ch}</span>`).join('');
  const cols=el.querySelectorAll('.od-s');let i=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{[...txt].forEach(ch=>{if(/\d/.test(ch)){const c=cols[i++];c.style.transitionDelay=(i*45)+'ms';c.style.transform=`translateY(-${+ch}em)`}})}));
}

/* --- carga con brillo (skeleton) --- */
function skeleton(){const a=$('#app');a.innerHTML=`<div class="grain"></div><div class="top"><img class="logo" src="${IMG.logo}" alt=""></div><div class="wrap">
  <div class="sk" style="height:16px;width:40%;margin-top:6px"></div><div class="sk" style="height:30px;width:70%;margin-top:10px"></div>
  <div class="sk" style="height:250px;margin-top:20px;border-radius:24px"></div><div class="sk" style="height:330px;margin-top:20px;border-radius:24px"></div></div>`}

/* --- tirar para recargar --- */
(function(){let y0=null,dy=0,el=null;
  document.addEventListener('touchstart',e=>{if(window.scrollY>0||document.querySelector('#scrim,.celebrate')||!D.me||!['client','admin'].includes(ui.view)){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0)return;if(!el){el=document.createElement('div');el.id='ptr';el.innerHTML=`<img src="${IMG.icon}" alt="">`;document.body.appendChild(el)}
    const k=Math.min(1,dy/110);el.style.opacity=k;el.style.transform=`translateY(${-70+k*80}px) rotate(${dy*2}deg)`},{passive:true});
  document.addEventListener('touchend',async()=>{if(y0===null||!el){y0=null;return}const go=dy>110;y0=null;
    if(go){el.classList.add('spin');haptic();try{await loadSettings();await loadMe();await loadAll();if(ui.chatMode==='bot')await loadBot();render(true)}catch(e){}}
    el.style.transition='transform .3s,opacity .3s';el.style.opacity=0;el.style.transform='translateY(-70px)';const x=el;el=null;setTimeout(()=>x.remove(),320)});
})();

/* --- deslizar para marcar la lista --- */
(function(){let row=null,x0=0,y0=0,dx=0,lock=null;
  document.addEventListener('touchstart',e=>{const r=e.target.closest('.check[data-act=tick]');if(!r){row=null;return}row=r;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;lock=null},{passive:true});
  document.addEventListener('touchmove',e=>{if(!row)return;const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;if(lock===null&&(Math.abs(mx)>8||Math.abs(my)>8))lock=Math.abs(mx)>Math.abs(my)?'x':'y';if(lock!=='x')return;dx=Math.max(0,Math.min(120,mx));row.style.transform=`translateX(${dx}px)`;row.classList.toggle('sw-go',dx>70)},{passive:true});
  document.addEventListener('touchend',()=>{if(!row)return;const r=row;row=null;r.style.transition='transform .3s cubic-bezier(.2,.9,.3,1.3)';r.style.transform='';setTimeout(()=>r.style.transition='',320);r.classList.remove('sw-go');if(lock==='x'&&dx>70){r._swiped=true;A.tick(r)}});
})();

/* --- asistente privado --- */
async function loadBot(){const{data}=await sb.from('assistant_messages').select('role,text,created_at').order('created_at').limit(200);D.bot=data||[]}
function botView(c){
  const first=(c.contact||'').split(' ')[0];const msgs=D.bot||[];
  return `<div class="chathead"><span class="botav"><img src="${IMG.icon}" alt=""></span><div><h3>Tu asistente</h3><div class="xs muted"><span class="online"></span>Responde al momento, a cualquier hora</div></div></div>
  <div class="quick mt16">${['¿Cuándo grabamos?','¿Qué tengo que preparar?','¿Cuánto pago este mes?','¿Cómo añado un día extra?','¿Cómo pido la baja?'].map(q=>`<button data-act="botQuick" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <div class="chat mt16" id="botBox">
    <div class="privacy">${I('lock','s')} Conversación privada: solo la ves tú</div>
    <div class="msg them bot"><div class="who">Asistente</div>¡Hola${first?', '+esc(first):''}! Conozco tu cuenta: tus grabaciones, tus pagos y lo que necesitamos de ti. ¿En qué te ayudo?</div>
    ${msgs.map(m=>`<div class="msg ${m.role==='user'?'me':'them bot'}">${m.role==='assistant'?'<div class="who">Asistente</div>':''}${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}
    <div id="botTyping"></div>
    ${msgs.length?`<button class="xs muted" style="align-self:center;margin-top:6px" data-act="botClear">Borrar conversación</button>`:''}
  </div>`;
}
async function botAsk(q){
  q=String(q||'').trim();if(!q)return;D.bot=D.bot||[];D.bot.push({role:'user',text:q});render(true);
  const t=$('#botTyping');if(t)t.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';scrollChat();
  const{data,error}=await sb.functions.invoke('assistant',{body:{text:q}});
  const reply=error?(await errMsg(error)):(data?.reply||data?.error||'No he podido responder ahora.');
  D.bot.push({role:'assistant',text:reply,typing:true});render(true);
  const last=[...document.querySelectorAll('#botBox .msg.bot')].pop();
  if(last){const full=esc(reply).replace(/\n/g,'<br>');const head='<div class="who">Asistente</div>';let i=0;const plain=reply;last.innerHTML=head+'<span class="caret"></span>';
    const step=()=>{i=Math.min(plain.length,i+Math.max(2,Math.round(plain.length/60)));last.innerHTML=head+esc(plain.slice(0,i)).replace(/\n/g,'<br>')+(i<plain.length?'<span class="caret"></span>':'');scrollChat();if(i<plain.length)setTimeout(step,16);else haptic()};step()}
  delete D.bot[D.bot.length-1].typing;
}

if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
