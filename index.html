body{background:#0b0c0d;color:var(--blanco);font-family:'Archivo',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.shell{min-height:100%;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:440px;min-height:100vh;background:var(--carbon);overflow-x:hidden;padding-bottom:96px}
@media(min-width:500px){.shell{padding:24px 0}#app{min-height:calc(100vh - 48px);border-radius:28px;border:1px solid #23242a;box-shadow:0 40px 120px rgba(0,0,0,.6)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:1}
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(70px);z-index:0}
.glow.o{background:var(--naranja);opacity:.32}
.glow.v{background:var(--verde);opacity:.22}
.wrap{position:relative;z-index:2;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--carbon) 70%,rgba(17,18,20,0))}
.top img.logo{height:22px;display:block}
.area-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gris)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.dot.local{background:var(--naranja)}.dot.labs{background:var(--verde)}.dot.studio{background:var(--gris)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--naranja)}
.label.g{color:var(--verde)}.label.n{color:var(--gris2)}
h1{font-size:38px;line-height:1.05;letter-spacing:-.02em;font-weight:700}
h2{font-size:26px;line-height:1.1;letter-spacing:-.015em;font-weight:700}
h3{font-size:18px;line-height:1.2;font-weight:700}
.muted{color:var(--gris)}.small{font-size:13.5px}.xs{font-size:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.hl{border-color:var(--naranja)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-weight:700;font-size:17px;padding:0 18px;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn.o{background:var(--naranja);color:var(--carbon)}
.btn.v{background:var(--verde);color:var(--carbon)}
.btn.w{background:var(--blanco);color:var(--carbon)}
.btn.ghost{background:var(--card2);color:var(--blanco);border:1px solid var(--line)}
.btn.outline{border:1px solid #3a3b41;color:var(--blanco)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.btn.pp{background:var(--paypal);color:#1b2a4e}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{color:var(--naranja);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.pill.o{background:rgba(218,127,44,.15);border-color:rgba(218,127,44,.5);color:var(--naranja2)}
.pill.v{background:rgba(128,168,168,.14);border-color:rgba(128,168,168,.45);color:var(--verde)}
.pill.r{background:rgba(217,83,79,.14);border-color:rgba(217,83,79,.45);color:#ef7f7b}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:18px;height:18px}
.ico.l{width:28px;height:28px}
/* landing */
.promo{border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(218,127,44,.22),rgba(218,127,44,.06));border:1px solid rgba(218,127,44,.5)}
.plazas{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.plazas i{height:10px;border-radius:3px;background:rgba(244,244,244,.12)}
.plazas i.on{background:var(--naranja)}
.pack{position:relative;border-radius:22px;padding:22px 20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pack.best{border-color:var(--naranja)}
.pack .ribbon{position:absolute;top:16px;right:16px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px}
.price b{font-size:46px;letter-spacing:-.03em;line-height:1}
.price s{color:var(--gris2);font-size:20px}
.price span{color:var(--gris);font-size:15px}
.feat{list-style:none;margin-top:16px;display:grid;gap:9px}
.feat li{display:flex;gap:10px;font-size:15px;color:#dcdde0}
.feat li svg{color:var(--naranja);margin-top:1px}
.steps3{display:grid;gap:10px}
.step3{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--carbon2);border:1px solid var(--line)}
.step3 .n{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--naranja);flex:none}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.team figure{border-radius:14px;overflow:hidden;background:#ddd}
.team img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.team figcaption{background:var(--card);padding:8px;font-size:12px;color:var(--gris)}
.team figcaption b{display:block;color:var(--blanco);font-size:13px}
.areas3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.areas3 div{padding:12px;border-radius:14px;background:var(--carbon2);border:1px solid var(--line);font-size:12.5px;color:var(--gris)}
.areas3 div b{display:flex;align-items:center;gap:6px;color:var(--blanco);font-size:15px;margin-bottom:4px}
.areas3 div.on{border-color:rgba(218,127,44,.6)}
/* forms */
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--gris);font-weight:600}
.inp{width:100%;min-height:52px;border-radius:14px;background:var(--carbon2);border:1px solid #2e2f35;padding:0 16px;font-size:16px;outline:none}
textarea.inp{padding:14px 16px;min-height:110px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--naranja)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:var(--carbon2);border:1px solid #2e2f35;font-size:14.5px;font-weight:600;color:#d6d7da}
.chip.on{background:rgba(218,127,44,.16);border-color:var(--naranja);color:var(--blanco)}
.opt{display:flex;gap:12px;padding:16px;border-radius:16px;background:var(--carbon2);border:1px solid #2e2f35;text-align:left;width:100%}
.opt.on{border-color:var(--naranja);background:rgba(218,127,44,.08)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #4a4b52;flex:none;margin-top:1px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--naranja)}
.opt.on .radio:after{content:'';width:10px;height:10px;border-radius:50%;background:var(--naranja)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;text-align:left;width:100%}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #4a4b52;flex:none;display:grid;place-items:center;transition:.15s}
.check.on .box{background:var(--naranja);border-color:var(--naranja);color:var(--carbon)}
.check.on .txt{color:var(--gris2);text-decoration:line-through}
.progress{display:flex;gap:6px;margin:6px 0 22px}
.progress i{flex:1;height:4px;border-radius:4px;background:#2b2c31}
.progress i.on{background:var(--naranja)}
/* client home */
.hero{position:relative;border-radius:24px;padding:20px;background:linear-gradient(160deg,#1f2024,#16171a);border:1px solid var(--line);overflow:hidden}
.hero .glow.o{width:220px;height:220px;right:-80px;bottom:-110px;opacity:.45}
.hero .glow.v{width:160px;height:160px;right:60px;bottom:-120px;opacity:.3}
.bigdate{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.bigdate .d{font-size:72px;font-weight:700;line-height:.85;letter-spacing:-.04em}
.bigdate .m{font-size:18px;font-weight:700;line-height:1.15}
.bigdate .m span{display:block;color:var(--gris);font-weight:400;font-size:15px}
.prep{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;background:var(--naranja);color:var(--carbon);text-align:left;margin-top:16px;position:relative;z-index:2}
.prep .ic{width:46px;height:46px;border-radius:14px;background:rgba(17,18,20,.14);display:grid;place-items:center;flex:none}
.prep b{font-size:15.5px;display:block;line-height:1.2;white-space:nowrap}
.prep small{font-size:13px;opacity:.8}
.ring{margin-left:auto;font-weight:700;font-size:13px;background:rgba(17,18,20,.16);padding:6px 9px;border-radius:10px}
/* calendar */
.cal{border-radius:24px;background:var(--card);border:1px solid var(--line);padding:18px 14px 14px;position:relative;overflow:hidden}
.cal-h{display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px 12px}
.cal-h .mo{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.cal-h .yr{font-size:14px;color:var(--gris2);font-weight:700;margin-left:6px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;border:1px solid var(--line)}
.cal-nav button[disabled]{opacity:.3}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{text-align:center;font-size:11px;color:var(--gris2);font-weight:700;padding:4px 0}
.day{position:relative;aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#55575e}
.day.av{color:var(--blanco);background:var(--carbon2);border:1px solid #34353b}
.day.av:after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--naranja)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--gris2);color:var(--blanco)}
.day.sel{background:var(--naranja);color:var(--carbon);border-color:var(--naranja)}
.day.sel:after{background:var(--carbon)}
.day.mine{background:var(--verde);color:var(--carbon);border-color:var(--verde)}
.day.mine:after{content:'';background:var(--carbon);width:14px;height:3px;border-radius:2px}
.day.full{color:#55575e;text-decoration:line-through}
.day.adm{color:#8a8d95;background:transparent;border:1px dashed #2e2f35}
.day.adm.open{background:rgba(218,127,44,.12);border:1px solid rgba(218,127,44,.55);color:var(--blanco)}
.day.adm .cnt{font-size:9.5px;font-weight:700;color:var(--verde);margin-top:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 6px 2px;font-size:12px;color:var(--gris)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.slots{display:grid;gap:8px;margin-top:14px}
.slot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--carbon2);border:1px solid #2e2f35;font-weight:700;font-size:16px}
.slot.on{border-color:var(--naranja);background:rgba(218,127,44,.12)}
.slot.off{opacity:.35;text-decoration:line-through;pointer-events:none}
/* month money */
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .l{display:flex;flex-direction:column}
.line .l small{color:var(--gris2);font-size:12.5px}
.line .r{font-weight:700;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:4px;background:var(--carbon2);border:1px solid #2e2f35;border-radius:12px;padding:3px}
.stepper button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--card2)}
.stepper b{min-width:24px;text-align:center}
.sum{border-radius:22px;padding:20px;background:var(--blanco);color:var(--carbon)}
.sum .eq{font-size:15px;color:#4a4c52;font-weight:600}
.sum .tot{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:6px}
.sum .sub{font-size:13px;color:#5c5f66;margin-top:6px}
.sum .btn.pp{margin-top:16px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.tile .ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--naranja)}
.tile .ic.v{color:var(--verde)}
.tile b{display:block;font-size:16px}
.tile small{color:var(--gris);font-size:13px}
.tile .chev{margin-left:auto;color:var(--gris2)}
.bar{height:8px;border-radius:8px;background:#2b2c31;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde);border-radius:8px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(17,18,20,0),var(--carbon) 30%)}
@media(min-width:500px){.nav{bottom:24px;border-radius:0 0 28px 28px}}
.nav-in{display:flex;justify-content:space-around;background:rgba(30,31,35,.94);backdrop-filter:blur(14px);border:1px solid #2c2d33;border-radius:22px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:700;color:var(--gris2);position:relative}
.nav button.on{color:var(--blanco);background:#2a2b31}
.nav button.on .ico{color:var(--naranja)}
.badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--naranja);color:var(--carbon);font-size:11px;display:grid;place-items:center;padding:0 5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.scrim.on{opacity:1}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:#18191c;border:1px solid #2c2d33;border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.scrim.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#3a3b41;margin:4px auto 14px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--blanco);color:var(--carbon);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;z-index:80;opacity:0;transition:.25s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.msg{max-width:82%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.4;background:var(--card2);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--naranja);color:var(--carbon);border-color:var(--naranja);border-bottom-right-radius:6px}
.msg.them{border-bottom-left-radius:6px}
.msg .who{font-size:11.5px;font-weight:700;color:var(--verde);margin-bottom:3px}
.msg .t{font-size:10.5px;opacity:.6;margin-top:4px;text-align:right}
.chatbar{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:8px 14px;z-index:25;display:flex;gap:8px;background:linear-gradient(rgba(17,18,20,0),var(--carbon) 35%)}
@media(min-width:500px){.chatbar{bottom:110px}}
.chatbar .inp{min-height:50px;border-radius:16px}
.chatbar button{width:50px;height:50px;border-radius:16px;background:var(--naranja);color:var(--carbon);display:grid;place-items:center;flex:none}
.avs{display:flex}
.avs img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--carbon);margin-left:-10px;background:#ddd}
.avs img:first-child{margin-left:0}
.av{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--naranja);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--gris2)}.kv dd{text-align:right;word-break:break-word}
.seg{display:flex;background:var(--carbon2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--gris)}
.seg button.on{background:var(--card2);color:var(--blanco)}
.demo-box{border:1px dashed #3a3b41;border-radius:16px;padding:14px;font-size:13.5px;color:var(--gris)}
.demo-box b{color:var(--blanco)}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid #2b2c31;border-top-color:var(--paypal);animation:sp 0.9s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.okc{width:72px;height:72px;border-radius:50%;background:var(--verde);color:var(--carbon);display:grid;place-items:center;margin:10px auto}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(218,127,44,.5)}50%{box-shadow:0 0 0 10px rgba(218,127,44,0)}}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 40px;position:relative}
.welcome .glow.o{width:340px;height:340px;right:-140px;bottom:120px;opacity:.5}
.welcome .glow.v{width:240px;height:240px;right:40px;bottom:40px;opacity:.35}
.sym{width:64px;opacity:.95}
.post{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.post .th{width:46px;height:58px;border-radius:9px;background:linear-gradient(160deg,#2a2b31,#1a1b1f);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--gris2);flex:none;border:1px solid var(--line)}
.post .th.r{background:linear-gradient(160deg,rgba(218,127,44,.35),#1a1b1f)}
.post .th.c{background:linear-gradient(160deg,rgba(128,168,168,.35),#1a1b1f)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.ninp{width:96px;min-height:44px;text-align:right;border-radius:12px;background:var(--carbon2);border:1px solid #2e2f35;padding:0 12px;outline:none}
.ninp:focus{border-color:var(--naranja)}
.sw{width:50px;height:30px;border-radius:30px;background:#3a3b41;position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--blanco);transition:.2s}
.sw.on{background:var(--naranja)}
.sw.on:after{left:23px}

/* ===== real-app additions ===== */
body{padding-top:env(safe-area-inset-top)}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.glow.drift{animation:drift 18s ease-in-out infinite alternate}
.glow.drift2{animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,-30px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-50px) scale(.9)}}
#splash{position:fixed;inset:0;z-index:200;background:var(--carbon);display:grid;place-items:center;transition:opacity .45s}
#splash img{width:84px;opacity:0;animation:sIn .35s .15s ease forwards}
#splash .glow.o{width:300px;height:300px;right:-120px;bottom:-60px;opacity:.45}
#splash .glow.v{width:220px;height:220px;right:40px;bottom:-120px;opacity:.3}
@keyframes sIn{to{opacity:1}}
#splash.out{opacity:0;pointer-events:none}
.stag>*{opacity:0;animation:fd .4s ease forwards}
.nostag .stag>*{animation:none;opacity:1}
.stag>*:nth-child(1){animation-delay:.02s}.stag>*:nth-child(2){animation-delay:.07s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.17s}.stag>*:nth-child(5){animation-delay:.22s}.stag>*:nth-child(6){animation-delay:.27s}.stag>*:nth-child(n+7){animation-delay:.3s}
/* landing hero */
.mega{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--naranja)}
.bigprice{display:flex;align-items:flex-start;gap:6px;margin-top:6px}
.bigprice b{font-size:112px;line-height:.82;letter-spacing:-.06em;font-weight:700}
.bigprice span{font-size:26px;font-weight:700;margin-top:6px}
.bigprice small{display:block;font-size:14px;color:var(--gris);font-weight:600;margin-top:2px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin:28px -20px 0;background:rgba(218,127,44,.06)}
.ticker div{display:inline-block;animation:tick 26s linear infinite;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#e6c7a8}
.ticker i{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--naranja);margin:0 14px 2px}
@keyframes tick{to{transform:translateX(-50%)}}
.slots10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.slots10 div{aspect-ratio:1;border-radius:14px;border:1px dashed #3a3b41;display:grid;place-items:center;font-weight:700;color:#55575e;font-size:15px;position:relative;overflow:hidden}
.slots10 div.on{border:1px solid var(--naranja);background:rgba(218,127,44,.16);color:var(--naranja2)}
.slots10 div.on:after{content:'';position:absolute;inset:auto 0 0 0;height:3px;background:var(--naranja)}
.photo-hero{position:relative;border-radius:22px;overflow:hidden;margin-top:24px}
.photo-hero img{width:100%;display:block;filter:grayscale(.15) contrast(1.05)}
.photo-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,18,20,0) 40%,rgba(17,18,20,.85))}
.photo-hero p{position:absolute;left:16px;bottom:14px;z-index:2;font-weight:700;font-size:15px}
/* ticket */
.ticket{position:relative;border-radius:24px;background:linear-gradient(150deg,#232428,#17181b 60%);border:1px solid #2e2f35;overflow:hidden}
.ticket .glow.o{width:240px;height:240px;right:-90px;top:-120px;opacity:.38}
.ticket .glow.v{width:160px;height:160px;right:40px;top:-110px;opacity:.25}
.ticket .tk-top{position:relative;z-index:2;padding:20px 20px 18px}
.ticket .tk-cut{position:relative;height:0;border-top:2px dashed #34353b;margin:0 22px}
.ticket .tk-cut:before,.ticket .tk-cut:after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--carbon);border:1px solid #2e2f35}
.ticket .tk-cut:before{left:-36px}.ticket .tk-cut:after{right:-36px}
.ticket .tk-bot{position:relative;z-index:2;padding:16px 20px 20px}
.tk-day{font-size:104px;font-weight:700;line-height:.8;letter-spacing:-.06em}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tk-meta div{font-size:12px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tk-meta b{display:block;color:var(--blanco);font-size:16px;letter-spacing:0;text-transform:none;margin-top:2px}
.barcode{height:34px;border-radius:4px;background:repeating-linear-gradient(90deg,#f4f4f4 0 2px,transparent 2px 4px,#f4f4f4 4px 5px,transparent 5px 8px,#f4f4f4 8px 11px,transparent 11px 12px);opacity:.85;flex:1}
.count{display:flex;gap:6px}
.count div{background:var(--carbon2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:46px}
.count b{display:block;font-size:18px;line-height:1}
.count small{font-size:10px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* chat */
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--gris2);text-transform:uppercase;letter-spacing:.08em;margin:6px 0}
.typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gris);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.msg{animation:fd .25s ease both}
.msg .t .rd{font-weight:700;margin-left:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:9px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#d6d7da}
.chathead{display:flex;align-items:center;gap:12px}
.online{width:9px;height:9px;border-radius:50%;background:#5fbf8f;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(95,191,143,.15)}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12px;color:var(--gris);font-weight:600}
.kpi.o{border-color:rgba(218,127,44,.5);background:linear-gradient(150deg,rgba(218,127,44,.14),var(--card))}
.search{position:relative}.search .ico{position:absolute;left:14px;top:15px;color:var(--gris2)}.search .inp{padding-left:44px}
.loading{opacity:.55;pointer-events:none}
.pp-box{margin-top:16px;min-height:50px}
.testtag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:#5c5f66;background:#e7e7e7;border-radius:8px;padding:4px 8px}
.install{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px dashed rgba(218,127,44,.55);background:rgba(218,127,44,.06)}
.err{color:#ef7f7b;font-size:13.5px;min-height:18px;margin-top:8px}
/*PREMIUM*/
/* ===================== PREMIUM LAYER ===================== */
:root{--navtop:92px}
.chatbar{bottom:var(--navtop)!important}
.chat{padding-bottom:calc(var(--navtop) + 74px)!important}
@media(min-width:500px){.chatbar{bottom:var(--navtop)!important}}
.topbar-l{display:flex;align-items:center;gap:10px}
.topback{width:40px;height:40px;border-radius:13px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--blanco);animation:fd .25s ease both}

/* sheets: close button + drag */
.sheet-x{position:sticky;top:-10px;z-index:6;display:flex;justify-content:flex-end;height:0;pointer-events:none}
.sheet-x button{pointer-events:auto;margin-top:-4px;width:38px;height:38px;border-radius:50%;background:#26272c;border:1px solid #34353b;display:grid;place-items:center;color:var(--blanco)}
.sheet.dragging{transition:none!important}
.grab{cursor:grab;padding:8px 0;margin-top:-4px;box-sizing:content-box;background-clip:content-box}

/* nav: sliding pill + pop */
.nav-in{position:relative}
.nav-ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:16px;background:#2c2d33;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .5s cubic-bezier(.2,.9,.25,1.12),width .35s ease;z-index:0;pointer-events:none}
.nav button{z-index:1;background:transparent!important}
.nav button.on .ico{animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(.6) translateY(3px)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* press feedback */
.btn,.tile,.prep,.chip,.slot,.day,.pill,.nav button,.check,.quick button,.holo,.kpi{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.pressed{transform:scale(.96)!important}

/* CTA shimmer */
.btn.o,.btn.pp{position:relative;overflow:hidden;isolation:isolate}
.btn.o:after,.btn.pp:after{content:'';position:absolute;inset:-2px;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
.btn.o>*,.btn.pp>*{position:relative}
@keyframes sweep{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* holographic cards */
.holo-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 20px 26px;margin:0 -20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.holo-row::-webkit-scrollbar{display:none}
.holo{flex:none;width:214px;aspect-ratio:5/7.2;scroll-snap-align:center;perspective:1000px;cursor:pointer;-webkit-user-select:none;user-select:none}
.holo-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)))}
.holo.live .holo-in{transition:transform .12s linear}
.holo.flipped{--flip:180deg}
.holo-face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4)}
.holo-front{background:#ddd}
.holo-front img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(.98);transform:scale(1.06) translate(calc(var(--mx,0) * -6px),calc(var(--my,0) * -6px))}
.foil{position:absolute;inset:0;z-index:2;mix-blend-mode:color-dodge;opacity:.7;pointer-events:none;
  background:linear-gradient(115deg,transparent 18%,rgba(218,127,44,.75) 32%,rgba(232,149,74,.4) 40%,rgba(128,168,168,.75) 50%,rgba(244,244,244,.7) 58%,rgba(218,127,44,.5) 66%,transparent 80%);
  background-size:260% 260%;background-position:var(--px,50%) var(--py,50%);filter:saturate(1.3)}
.foil2{position:absolute;inset:0;z-index:2;opacity:.18;mix-blend-mode:overlay;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 1px,transparent 1px 4px)}
.glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at var(--px,50%) var(--py,25%),rgba(255,255,255,.75),rgba(255,255,255,.12) 28%,transparent 55%);mix-blend-mode:overlay}
.holo-cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(17,18,20,.95) 55%)}
.holo-cap b{display:block;font-size:21px;letter-spacing:-.02em;color:#fff}
.holo-cap span{font-size:11px;color:var(--gris);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.holo-chip{position:absolute;top:12px;left:12px;z-index:4;display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:rgba(17,18,20,.7);backdrop-filter:blur(8px);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.holo-no{position:absolute;top:12px;right:12px;z-index:4;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);background:rgba(17,18,20,.55);padding:4px 8px;border-radius:8px}
.holo-back{transform:rotateY(180deg);background:linear-gradient(160deg,#232428,#121315);padding:18px;display:flex;flex-direction:column}
.holo-back .glow.o{width:180px;height:180px;right:-70px;bottom:-80px;opacity:.5}
.holo-back img.sym{width:34px;opacity:.9}
.flip-hint{font-size:11px;color:var(--gris2);text-align:center;margin-top:-12px}

/* ticket: foil + 3D flip */
.tk-flip{display:grid;perspective:1200px}
.tk-flip>.tk-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tk-flip .tk-back{transform:rotateY(180deg)}
.tk-flip.flipped .tk-front{transform:rotateY(-180deg)}
.tk-flip.flipped .tk-back{transform:rotateY(0)}
.ticket{transform:rotateX(calc(var(--rx,0deg)*.35)) rotateY(calc(var(--ry,0deg)*.35));transform-style:preserve-3d}
.ticket .foil{border-radius:24px;opacity:.38;mix-blend-mode:color-dodge}
.ticket .glare{border-radius:24px;opacity:.7}
.tk-flipbtn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:var(--gris)}
.qr{width:92px;height:92px;border-radius:12px;background:#f4f4f4;padding:7px;flex:none}
.tk-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

/* dynamic island */
.island{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%) scale(.9);z-index:45;background:#000;color:#fff;border-radius:999px;padding:8px 16px 8px 9px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.2,.9,.25,1.18);border:1px solid #1d1d1f;white-space:nowrap}
.island.on{transform:translate(-50%,0) scale(1)}
.island .rec{width:26px;height:26px;border-radius:50%;background:var(--naranja);display:grid;place-items:center;color:#111}
.island .rec svg{width:15px;height:15px}
.island small{color:#9a9da4;font-weight:600;margin-left:2px}
.island .lv{width:7px;height:7px;border-radius:50%;background:#ff453a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* celebration: ticket printing */
.celebrate{position:fixed;inset:0;z-index:150;background:rgba(9,9,11,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease both;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.celebrate.out{animation:fadeOut .35s ease forwards}
@keyframes fadeOut{to{opacity:0}}
.printer{width:300px;height:26px;border-radius:14px;background:linear-gradient(#34353b,#202126);border:1px solid #45464d;position:relative;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.printer:after{content:'';position:absolute;left:18px;right:18px;bottom:6px;height:4px;border-radius:4px;background:#0b0b0c}
.printer i{position:absolute;right:14px;top:9px;width:7px;height:7px;border-radius:50%;background:#3ad07a;box-shadow:0 0 8px #3ad07a;animation:blink 0.5s 4}
.print-clip{width:268px;overflow:hidden;margin-top:-10px;padding-bottom:30px}
.print-ticket{transform:translateY(-104%);animation:printOut 1.6s .35s cubic-bezier(.35,.75,.25,1) forwards;background:var(--blanco);color:var(--carbon);border-radius:0 0 18px 18px;padding:26px 20px 20px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.print-ticket:before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,#d9d9d9 0 6px,transparent 6px 12px);opacity:.6}
@keyframes printOut{0%{transform:translateY(-104%)}70%{transform:translateY(-6%)}100%{transform:translateY(0)}}
.print-ticket .big{font-size:84px;font-weight:700;line-height:.85;letter-spacing:-.06em}
.print-ticket .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--naranja)}
.print-ticket .bc{height:30px;margin-top:14px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px)}
.cel-title{opacity:0;animation:fd .5s 1.7s ease forwards;text-align:center;margin-top:8px}
.cel-btn{opacity:0;animation:fd .5s 2s ease forwards;width:268px;margin-top:18px}
.bit{position:absolute;top:-20px;width:9px;height:9px;border-radius:2px;opacity:0;animation:fall 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}

/* odometer */
.odo{display:inline-flex;align-items:flex-start;overflow:hidden;line-height:1;height:1em}
.od{display:inline-block;height:1em;overflow:hidden;position:relative}
.od-s{display:flex;flex-direction:column;transition:transform 1.1s cubic-bezier(.2,.85,.2,1)}
.od-s span{height:1em;line-height:1;display:block}

/* skeleton */
.sk{background:linear-gradient(100deg,#1d1e22 30%,#2a2b31 50%,#1d1e22 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:16px}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}

/* pull to refresh */
#ptr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:44;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#1d1e22;border:1px solid #33343a;display:grid;place-items:center;transform:translateY(-70px);opacity:0;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#ptr img{width:22px}
#ptr.spin img{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* swipe checklist */
.check{position:relative;touch-action:pan-y}
.check .txt{transition:color .2s}
.check.sw-go{background:linear-gradient(90deg,rgba(128,168,168,.18),transparent);border-radius:12px}

/* calendar day entrance */
.grid.anim .day{animation:dayIn .4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes dayIn{from{opacity:0;transform:translateY(8px) scale(.92)}}
.day.sel{animation:selPop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes selPop{0%{transform:scale(.85)}100%{transform:scale(1)}}

/* sticky CTA landing */
.stickycta{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);width:calc(100% - 28px);max-width:412px;z-index:35;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:rgba(30,31,35,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #33343a;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:transform .5s cubic-bezier(.2,.9,.25,1.15)}
.stickycta.on{transform:translate(-50%,0)}
.stickycta b{font-size:16px}
.stickycta small{display:block;font-size:12px;color:var(--naranja2);font-weight:700}
.stickycta .btn{width:auto;min-height:46px;padding:0 18px;font-size:15px;border-radius:14px}

/* assistant */
.mode{display:flex;background:var(--carbon2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;position:relative}
.mode button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--gris);z-index:1;transition:color .2s}
.mode button.on{color:var(--blanco)}
.mode .mi{position:absolute;top:4px;bottom:4px;width:calc(50% - 6px);left:4px;border-radius:12px;background:var(--card2);transition:transform .45s cubic-bezier(.2,.9,.25,1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mode.bot .mi{transform:translateX(calc(100% + 4px))}
.botav{width:44px;height:44px;border-radius:14px;background:radial-gradient(circle at 30% 30%,#f0a560,var(--naranja) 60%,#a85a17);display:grid;place-items:center;box-shadow:0 8px 20px rgba(218,127,44,.35);position:relative;flex:none}
.botav img{width:24px;filter:brightness(0)}
.botav:after{content:'';position:absolute;inset:-4px;border-radius:17px;border:1.5px solid rgba(218,127,44,.45);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.msg.bot{background:linear-gradient(160deg,#25262b,#1e1f23);border-color:#33343a}
.msg.bot .who{color:var(--naranja2)}
.privacy{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--gris2);justify-content:center;margin:4px 0 8px}
.caret:after{content:'▍';animation:blink .8s infinite;color:var(--naranja);margin-left:1px}

::view-transition-old(root){animation:vtOut .22s ease both}
::view-transition-new(root){animation:vtIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0;transform:scale(.985)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* caras 3D: ocultar la cara trasera de verdad (algunos móviles la transparentan) */
.tk-flip>.tk-face{transition:transform .8s cubic-bezier(.2,.8,.2,1),visibility 0s linear .4s}
.tk-flip .tk-back{visibility:hidden}
.tk-flip.flipped .tk-back{visibility:visible}
.tk-flip.flipped .tk-front{visibility:hidden}
.holo-face{transition:visibility 0s linear .32s}
.holo .holo-back{visibility:hidden}
.holo.flipped .holo-back{visibility:visible}
.holo.flipped .holo-front{visibility:hidden}
.ticket{transform-style:flat!important}
a.btn{text-decoration:none;color:inherit}
/* ticket: botón calendario */
.tk-cal{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 11px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;color:var(--blanco);text-decoration:none}
/* ===== tarjetas profesionales: mate + barniz brillante ===== */
.holo.pro{width:228px;aspect-ratio:54/85}
.pro .holo-face{border-radius:16px;border:0;box-shadow:0 30px 60px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.04) inset}
.pc{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#151618;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.12)}
.pc:before{content:'';position:absolute;inset:0;z-index:1;opacity:.5;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.pc-photo{position:absolute;left:0;right:0;top:0;height:66%;overflow:hidden}
.pc-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:translate(calc(var(--mx,0)*-4px),calc(var(--my,0)*-4px)) scale(1.03)}
.pc-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,22,24,.55) 0%,rgba(21,22,24,0) 22%,rgba(21,22,24,0) 50%,#151618 98%)}
.pc-top{position:absolute;top:14px;left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;align-items:center}
.pro img.pc-logo{width:auto!important;height:13px!important;object-fit:contain;filter:none!important;transform:none!important;opacity:.95}
.pro .pc-photo img{filter:brightness(.92) contrast(1.05)!important}
.pc-no{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.6)}
.pc-body{position:absolute;left:16px;right:16px;bottom:14px;z-index:3}
.pc-role{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--naranja)}
.pc-name{display:block;font-size:25px;line-height:1.05;letter-spacing:-.02em;color:#f4f4f4;margin-top:5px}
.pc-line{display:block;height:1px;margin:12px 0 9px;background:linear-gradient(90deg,rgba(218,127,44,.9),rgba(255,255,255,.08) 70%)}
.pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.pc-foot .dot{width:6px;height:6px;vertical-align:1px}
/* barniz brillante (spot UV): el símbolo grabado solo brilla al darle la luz */

  background:radial-gradient(70% 45% at var(--px,50%) var(--py,30%),rgba(255,255,255,.14),transparent 70%);mix-blend-mode:soft-light}
.pc-back{background:#141517}
.pc-backin{position:absolute;inset:0;z-index:3;padding:18px 16px 16px;display:flex;flex-direction:column}
.pc-backin .pc-logo{height:14px!important;align-self:flex-start}
.pro .holo-back{transform:rotateY(180deg);background:none;padding:0}

.kpi b .odo,.kpi b .odo span{font-size:30px;color:var(--blanco);font-weight:700;letter-spacing:-.03em}
/* ===================== V3 · CINE ===================== */
:root{--carbon:#0a0a0b;--carbon2:#101012;--card:#111113;--card2:#18181b;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.14);--gris:#a7aab1;--gris2:#6c6f77;--blanco:#f2f2f0}
body{background:#030303}
#app{background:var(--carbon)}
.glow,.foil,.glare{display:none!important}
.grain{opacity:.075!important;position:fixed!important;z-index:60!important}
.vig{position:fixed;inset:0;pointer-events:none;z-index:59;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
.btn.o:after,.btn.pp:after{display:none!important}
.btn{border-radius:14px;letter-spacing:-.01em}
.btn.o{background:var(--naranja);color:#0a0a0b;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.outline{border-color:var(--line2)}
.card,.tile,.pack,.kpi,.step3,.install{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.card.hl{border-color:rgba(218,127,44,.55)!important}
.tile .ic,.prep .ic{background:transparent!important;border:1px solid var(--line2)}
h1{font-size:40px;letter-spacing:-.04em;line-height:1}
h2{letter-spacing:-.035em}
.label{letter-spacing:.22em;font-size:10.5px}
.top{background:linear-gradient(var(--carbon) 72%,rgba(10,10,11,0))}
.cal{background:var(--card)!important;border:1px solid var(--line)!important}
.sheet{background:#0f0f11!important;border-color:var(--line2)!important}
.nav-in{background:rgba(14,14,16,.92)!important;border:1px solid var(--line2)!important}
.nav-ind{background:#222226!important}
.nav button{font-size:10.5px!important}
.nav.n5 button{padding-left:2px!important;padding-right:2px!important}
.nav.n6 button{padding-left:0!important;padding-right:0!important;font-size:9.6px!important;letter-spacing:-.02em}
.adot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.fin3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fin3>div{border-top:1px solid var(--line2);padding-top:10px}.fin3 small{display:block;font-size:11px;color:var(--gris2);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.fin3 b{font-size:17px;letter-spacing:-.02em}
.farea{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}.farea:last-of-type{border-bottom:0}
.fbar{height:7px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden}.fbar i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}.fbar i.in,.yb i.in{background:#7fc8a9}.fbar i.out,.yb i.out{background:#ef7f7b}
.ybars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:130px}.yb{display:flex;flex-direction:column;align-items:center;gap:6px}.yb-c{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}.yb i{width:42%;border-radius:3px 3px 0 0;min-height:1px}.yb small{font-size:10px;color:var(--gris2);font-weight:700}
.inp,.ninp{background:#0c0c0e!important;border-color:var(--line2)!important}
.pill{background:transparent;border-color:var(--line2)}
.chip{background:transparent!important;border-color:var(--line2)!important}
.chip.on{background:var(--blanco)!important;color:#0a0a0b!important;border-color:var(--blanco)!important}
.seg{background:#0c0c0e!important;border-color:var(--line)!important}
.seg button.on{background:#232327!important}
/* pantallas centradas */
.welcome{justify-content:center!important;align-items:center;text-align:center;padding:40px 26px!important;min-height:100svh!important}
.welcome .sym{margin:0 auto}
.center-screen{min-height:calc(100svh - 150px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding-bottom:20px}
.center-screen .hd{text-align:center}
.center-screen .sym{display:block;margin:0 auto}
.kicker{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gris2);font-weight:700}
.title-xl{font-size:44px;line-height:.95;letter-spacing:-.045em;font-weight:700}
/* raíl de pasos */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:18px}
.rail:before{content:'';position:absolute;left:12.5%;right:12.5%;top:15px;height:1px;background:var(--line2)}
.rail .st{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;z-index:1}
.rail .st i{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--carbon);border:1px solid var(--line2);color:var(--gris2)}
.rail .st span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris2)}
.rail .st.ok i{background:var(--blanco);border-color:var(--blanco);color:#0a0a0b}
.rail .st.ok span{color:var(--gris)}
.rail .st.on i{background:var(--naranja);border-color:var(--naranja);color:#0a0a0b;box-shadow:0 0 0 5px rgba(218,127,44,.14)}
.rail .st.on span{color:var(--blanco)}
/* panel de siguiente paso */
.next{position:relative;border-radius:22px;padding:22px 20px;border:1px solid var(--line2);background:linear-gradient(180deg,#141416,#0e0e10);overflow:hidden}
.next .num{position:absolute;right:16px;top:6px;font-size:120px;font-weight:700;letter-spacing:-.08em;line-height:1;color:rgba(255,255,255,.04);pointer-events:none}
.next h2{font-size:28px}
.next .when{font-size:56px;font-weight:700;letter-spacing:-.06em;line-height:.9}
/* claqueta */
.clap{border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:#0d0d0f}
.clap .bars{height:34px;background:repeating-linear-gradient(-45deg,#f2f2f0 0 22px,#0d0d0f 22px 44px);border-bottom:1px solid var(--line2)}
.clap .cin{padding:16px 18px 18px}
.clap .grid4{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:14px}
.clap .grid4>div{padding:10px 0 2px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris2);font-weight:700}
.clap .grid4>div b{display:block;font-size:16px;letter-spacing:-.01em;text-transform:none;color:var(--blanco);margin-top:3px}
.clap .grid4>div:nth-child(odd){border-right:1px solid var(--line);padding-right:12px}
.clap .grid4>div:nth-child(even){padding-left:14px}
.clap .big{font-size:96px;font-weight:700;letter-spacing:-.07em;line-height:.8}
/* listas */
.lst{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.lst>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-size:15px}
.li small{display:block;color:var(--gris);font-size:12.5px;margin-top:1px}
.need{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;width:100%;text-align:left}
.need .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1px}
.need.on .bx{background:var(--verde);border-color:var(--verde);color:#0a0a0b}
.need.on .t{color:var(--gris2);text-decoration:line-through}
/* tareas */
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;transition:opacity .3s}
.task .tk-check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:#0a0a0b;transition:background .2s,border-color .2s}
.task .tk-main{flex:1;min-width:0;cursor:pointer}
.task b{display:block;font-size:15px;font-weight:600;position:relative;width:fit-content;max-width:100%}
.task b:after{content:'';position:absolute;left:0;top:52%;height:1.5px;width:0;background:var(--gris2);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.task small{display:block;font-size:12.5px;color:var(--gris);margin-top:2px}
.task small .cl{color:var(--naranja2);font-weight:700}
.task small .late{color:#ef7f7b;font-weight:700}
.task.done{opacity:.5}
.task.done .tk-check{background:var(--verde);border-color:var(--verde)}
.task.done b{color:var(--gris2)}
.task.done b:after{width:100%}
.tav{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line2)}
.people{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.people::-webkit-scrollbar{display:none}
.person{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid var(--line2);font-weight:700;font-size:13.5px;color:var(--gris)}
.person img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.person.on{background:var(--blanco);color:#0a0a0b;border-color:var(--blanco)}
.load{display:flex;align-items:baseline;gap:8px}
.load b{font-size:44px;letter-spacing:-.05em;line-height:1}
/* avatares / logos */
.lg{width:44px;height:44px;border-radius:12px;background:#1b1b1e;border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--gris);overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:cover}
.lg.xl{width:84px;height:84px;border-radius:22px;font-size:32px}
.lg.sm{width:34px;height:34px;border-radius:10px;font-size:14px}
.lg-edit{position:relative;display:inline-block}
.lg-edit>.cam{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--blanco);color:#0a0a0b;display:grid;place-items:center;border:3px solid var(--carbon)}
.lg-edit input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* archivos */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ftile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#141416;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--blanco)}
.ftile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftile .fic{position:absolute;inset:0;display:grid;place-items:center;color:var(--gris)}
.ftile .fn{position:relative;font-size:10.5px;font-weight:600;padding:5px 7px;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile .fx{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:2}
.upl{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;border:1px dashed rgba(218,127,44,.6);color:var(--naranja2);font-weight:700;cursor:pointer;position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl.big{min-height:120px;flex-direction:column;gap:6px;text-align:center}
.upl.big small{color:var(--gris);font-weight:500}
/* calendario de contenido */
.post{display:flex;gap:14px;padding:14px 16px;width:100%;text-align:left}
.post .dd{width:46px;flex:none;text-align:center}
.post .dd b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1}
.post .dd small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris2);font-weight:700}
.post .bd{flex:1;min-width:0}
.post .bd b{display:block;font-size:15.5px}
.post .bd p{font-size:13px;color:var(--gris);margin-top:3px;white-space:pre-wrap}
.ty{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--gris)}
.ty.reel{color:var(--naranja2);border-color:rgba(218,127,44,.45)}
.ty.carrusel{color:var(--verde);border-color:rgba(128,168,168,.45)}
.ty.story,.ty.tiktok{color:#c9b8ff;border-color:rgba(201,184,255,.35)}
.st-pub{font-size:10.5px;font-weight:700;color:var(--verde);margin-left:6px}
.day .dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--naranja)}
.day .dots i.carrusel{background:var(--verde)}.day .dots i.story,.day .dots i.tiktok{background:#c9b8ff}
.day{position:relative}
.day.hasp{color:var(--blanco);font-weight:700}
.guion{white-space:pre-wrap;font-size:14.5px;line-height:1.55;color:#dcdcdf}
/* secciones del panel cliente (equipo) */
.cphead{display:flex;gap:14px;align-items:center}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--line2);font-weight:700;font-size:13.5px;color:var(--gris)}
.segs button.on{background:var(--blanco);color:#0a0a0b;border-color:var(--blanco)}
.inbox .li .ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--naranja2)}
.dot-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--naranja);color:#0a0a0b;font-size:11.5px;font-weight:700}
a.pill{color:inherit;text-decoration:none}
.more2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line2);background:var(--card);min-height:150px}
.mcard .ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--naranja2);margin-bottom:8px}
.mcard b{font-size:15px;line-height:1.15}.mcard small{font-size:12px;color:var(--gris);line-height:1.3}.mcard .pr{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:700;color:var(--naranja2)}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);font-family:ui-monospace,Menlo,monospace;font-size:14px;width:100%;text-align:left}
.empty{padding:22px 16px;text-align:center;color:var(--gris2);font-size:13.5px}
/* tarjetas del equipo: fotos nítidas, sin niebla */
.pc-photo:after{background:linear-gradient(180deg,rgba(0,0,0,0) 58%,#151618 100%)!important}
.pro .pc-photo img{filter:none!important}
.pc-top{display:none}
/* rendimiento */
.stag>*{animation-duration:.32s}
img{content-visibility:auto}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const eur=n=>{n=Math.round(num(n)*100)/100;const d=Number.isInteger(n)?0:2;return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:2})+' €'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const nice=s=>{const d=parse(s);return `${cap(DIA[d.getDay()])} ${d.getDate()} de ${MES[d.getMonth()]}`};
const short=s=>{const d=parse(s);return `${d.getDate()} ${MES[d.getMonth()].slice(0,3)}`};
const hhmm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayLabel=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);const diff=Math.round((TODAY-d)/864e5);return diff===0?'Hoy':diff===1?'Ayer':`${d.getDate()} de ${MES[d.getMonth()]}`};
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'');
const workMonth=()=>TODAY.getDate()>24?ym(addMonths(TODAY,1)):ym(TODAY);
const monthName=k=>MES[Number(k.slice(5,7))-1];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

async function loadSettings(){const{data,error}=await sb.from('settings').select('data').eq('id',1).single();if(error)throw error;D.settings=data.data}

async function loadAll(){
  const today=iso(TODAY);
  const keys=['av','bk','ex','ev','pay','msg','taken','posts','files','inv'];
  const q=[sb.from('availability').select('*').gte('date',today),sb.from('bookings').select('*').order('date'),sb.from('extras').select('*'),
    sb.from('events').select('*').order('created_at',{ascending:false}),sb.from('payments').select('*').order('date',{ascending:false}),
    sb.from('messages').select('*').order('created_at').limit(2000),sb.rpc('taken_slots'),sb.from('posts').select('*').order('date'),
    sb.from('files').select('*').order('created_at',{ascending:false}),sb.from('invoices').select('*').order('created_at',{ascending:false})];
  if(isAdmin()){keys.push('profiles','tasks','finance');q.push(sb.from('profiles').select('*').order('created_at'),sb.from('tasks').select('*').order('created_at'),sb.from('finance').select('*').order('date',{ascending:false}))}
  const r=await Promise.all(q);const R={};keys.forEach((k,i)=>{if(r[i].error)console.warn(k,r[i].error);R[k]=r[i].data||[]});
  D.availability={};R.av.forEach(a=>D.availability[a.date]=a.slots);
  D.bookings=R.bk;D.extras=R.ex;D.events=R.ev;D.payments=R.pay;D.messages=R.msg;D.taken=R.taken;D.posts=R.posts;D.files=R.files;D.invoices=R.inv;
  if(isAdmin()){D.profiles=R.profiles;D.tasks=R.tasks;D.finance=R.finance}
}
let rtChan=null,typeChan=null,reloadT=null;
function subscribeRealtime(){
  if(rtChan)sb.removeChannel(rtChan);
  rtChan=sb.channel('db-'+D.me.id);
  ['messages','events','bookings','availability','extras','payments','profiles','settings','posts','files','tasks','invoices','finance'].forEach(t=>{
    rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},p=>onChange(t,p));
  });
  rtChan.subscribe();
  subscribeTyping();
}
function subscribeTyping(){
  if(typeChan){sb.removeChannel(typeChan);typeChan=null}
  const room=isAdmin()?ui.chatWith:D.me.id;if(!room)return;
  typeChan=sb.channel('typing-'+room,{config:{broadcast:{self:false}}});
  typeChan.on('broadcast',{event:'typing'},({payload})=>{
    if(!!payload.team===isAdmin())return;
    ui.typing={who:payload.who,until:Date.now()+3500};showTyping();
    setTimeout(()=>{if(ui.typing&&Date.now()>ui.typing.until){ui.typing=null;showTyping()}},3700);
  }).subscribe();

function render(keepScroll){
  const a=$('#app');const y=window.scrollY;
  // preserve inputs
  const keep={};['chatI','achatI','cq','botI'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const focus=document.activeElement?.id;
  let h='';
  try{
    if(ui.view==='landing')h=vLanding();else if(ui.view==='welcome')h=vWelcome();else if(ui.view==='login')h=vLogin();
    else if(ui.view==='signup')h=vSignup();else if(ui.view==='client')h=vClient();else if(ui.view==='admin')h=vAdmin();
  }catch(e){console.error(e);h=`<div class="wrap"><p class="mt48">Algo ha fallado. <button class="link" onclick="location.reload()">Recargar</button></p></div>`}
  a.classList.toggle('nostag',!!keepScroll);
  a.innerHTML='<div class="grain"></div><div class="vig"></div>'+h;
  Object.entries(keep).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v});
  if(focus){const el=document.getElementById(focus);if(el){el.focus();if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}}
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  afterRender();
}
function softRender(){if(document.querySelector('#scrim'))return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!['chatI','achatI','cq','botI'].includes(ae.id))return;render(true)}
function go(v){ui.view=v;render()}

  document.querySelectorAll('[data-count]').forEach(countUp);
  if($('#ppSignup'))mountPayPalSignup();
  if($('#ppExtras'))mountPayPalExtras();
  tickCountdown();
  document.querySelectorAll('[data-odo]').forEach(runOdo);

function countUp(el){const to=num(el.dataset.count);const dur=550,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=eur(Math.round(to*e*100)/100);if(k<1)requestAnimationFrame(f);else el.textContent=eur(to)};requestAnimationFrame(f)}
let cdT=null;
function tickCountdown(){clearInterval(cdT);const el=$('#cd');if(!el)return;const target=new Date(el.dataset.t);const upd=()=>{const ms=target-new Date();if(ms<=0){el.innerHTML='<div><b>¡Hoy!</b><small>rodaje</small></div>';return}const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);el.innerHTML=`<div><b>${d}</b><small>días</small></div><div><b>${h}</b><small>horas</small></div><div><b>${m}</b><small>min</small></div>`};upd();cdT=setInterval(upd,30000)}

function sheet(html,onMount){const had=!!$('#scrim');closeSheet(true);const d=document.createElement('div');d.className='scrim';d.id='scrim';
  d.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div><div class="sheet-x"><button data-act="sheetClose" aria-label="Cerrar">${I('x','s')}</button></div>${html}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)sheetClose()});document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));document.body.style.overflow='hidden';
  if(!had)pushNav('sheet');
  const sh=d.querySelector('.sheet'),gr=d.querySelector('.grab');let y0=null,dy=0;
  const st=e=>{if(sh.scrollTop>0&&!e.target.closest('.grab'))return;y0=(e.touches?e.touches[0]:e).clientY;dy=0};
  const mv=e=>{if(y0===null)return;dy=(e.touches?e.touches[0]:e).clientY-y0;if(dy<=0){sh.style.transform='';return}sh.classList.add('dragging');sh.style.transform=`translateY(${dy}px)`};
  const en=()=>{if(y0===null)return;y0=null;sh.classList.remove('dragging');if(dy>110){sheetClose()}else sh.style.transform=''};
  gr.addEventListener('touchstart',st,{passive:true});sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0)st(e)},{passive:true});sh.addEventListener('touchmove',mv,{passive:true});sh.addEventListener('touchend',en);
  onMount&&onMount(d);scanUrls(d)}
function sheetClose(){if(history.state&&history.state.lml==='sheet'){history.back()}else closeSheet()}
function closeSheet(now){const d=$('#scrim');if(!d)return;document.body.style.overflow='';if(now){d.remove();return}const sh=d.querySelector('.sheet');if(sh&&sh.style.transform)sh.style.transform='translateY(100%)';d.classList.remove('on');setTimeout(()=>{d.remove();softRender()},250)}
function toast(t){let x=$('#toast');if(!x){x=document.createElement('div');x.id='toast';x.className='toast';document.body.appendChild(x)}x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),2600)}

  if(ui.view==='client'){if(ui.tab==='chat'&&ui.chatMode==='bot'){ui.chatMode='team';render();return}if(ui.tab!=='inicio'){ui.tab='inicio';vt(()=>render());return}}

async function resizeImg(file,max=640){const bmp=await createImageBitmap(file).catch(()=>null);if(!bmp)return file;const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);const png=/png/.test(file.type);return await new Promise(r=>cv.toBlob(b=>r(new File([b],png?'logo.png':'logo.jpg',{type:png?'image/png':'image/jpeg'})),png?'image/png':'image/jpeg',.9))}
async function uploadLogo(cid,file,bucketPath){const f=await resizeImg(file,bucketPath?900:640);const path=bucketPath||`${cid}/logo-${Date.now()}.${f.type==='image/png'?'png':'jpg'}`;const{error}=await sb.storage.from('logos').upload(path,f,{contentType:f.type,upsert:true});if(error)throw error;return path}

function finRows(){
  const man=D.finance.map(f=>({...f,src:'manual'}));
  const app=D.payments.filter(p=>p.status==='pagado').map(p=>({id:'pay_'+p.id,date:p.date,kind:'ingreso',area:'local',category:'Cuota (app)',concept:`${p.concept} · ${prof(p.client_id).business||'Cliente'}`,amount:num(p.base),iva_pct:p.iva??ivaFor(prof(p.client_id)),client_id:p.client_id,src:'app'}));
  return [...man,...app].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created_at||'').localeCompare(a.created_at||''));
}

/* --- haptics: Android vibrate + iOS switch trick (progresivo: si no hay, no pasa nada) --- */
let _hapEl=null;
function haptic(kind){
  try{if(navigator.vibrate){navigator.vibrate(kind==='ok'?[12,40,18]:10);return}}catch(e){}
  try{if(!_hapEl){const l=document.createElement('label');l.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);document.body.appendChild(l);_hapEl=l}
    _hapEl.click();if(kind==='ok')setTimeout(()=>_hapEl.click(),90)}catch(e){}
}

let _navX=null,_navW=null;
function placeNavInd(animate=true){
  const nav=document.querySelector('.nav-in');if(!nav)return;const on=nav.querySelector('button.on');if(!on)return;
  let ind=nav.querySelector('.nav-ind');if(!ind){ind=document.createElement('i');ind.className='nav-ind';nav.prepend(ind)}
  const x=on.offsetLeft,w=on.offsetWidth;
  if(_navX!==null&&animate){ind.style.transition='none';ind.style.width=_navW+'px';ind.style.transform=`translateX(${_navX}px)`;ind.offsetWidth;ind.style.transition=''}
  requestAnimationFrame(()=>{ind.style.width=w+'px';ind.style.transform=`translateX(${x}px)`});_navX=x;_navW=w;
}
