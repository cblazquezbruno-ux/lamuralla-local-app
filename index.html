body{background:#0b0c0d;color:var(--blanco);font-family:'Archivo',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.shell{min-height:100%;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:440px;min-height:100vh;background:var(--carbon);overflow-x:hidden;padding-bottom:96px}
@media(min-width:500px){.shell{padding:24px 0}#app{min-height:calc(100vh - 48px);border-radius:28px;border:1px solid #23242a;box-shadow:0 40px 120px rgba(0,0,0,.6)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");z-index:1}
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(70px);z-index:0}
.glow.o{background:var(--naranja);opacity:.32}
.glow.v{background:var(--verde);opacity:.22}
.wrap{position:relative;z-index:2;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--carbon) 70%,rgba(17,18,20,0))}
.top img.logo{height:22px;display:block}
.area-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gris)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.dot.local{background:var(--naranja)}.dot.labs{background:var(--verde)}.dot.studio{background:var(--gris)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--naranja)}
.label.g{color:var(--verde)}.label.n{color:var(--gris2)}
h1{font-size:38px;line-height:1.05;letter-spacing:-.02em;font-weight:700}
h2{font-size:26px;line-height:1.1;letter-spacing:-.015em;font-weight:700}
h3{font-size:18px;line-height:1.2;font-weight:700}
.muted{color:var(--gris)}.small{font-size:13.5px}.xs{font-size:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.hl{border-color:var(--naranja)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-weight:700;font-size:17px;padding:0 18px;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn.o{background:var(--naranja);color:var(--carbon)}
.btn.v{background:var(--verde);color:var(--carbon)}
.btn.w{background:var(--blanco);color:var(--carbon)}
.btn.ghost{background:var(--card2);color:var(--blanco);border:1px solid var(--line)}
.btn.outline{border:1px solid #3a3b41;color:var(--blanco)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.btn.pp{background:var(--paypal);color:#1b2a4e}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{color:var(--naranja);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.pill.o{background:rgba(218,127,44,.15);border-color:rgba(218,127,44,.5);color:var(--naranja2)}
.pill.v{background:rgba(128,168,168,.14);border-color:rgba(128,168,168,.45);color:var(--verde)}
.pill.r{background:rgba(217,83,79,.14);border-color:rgba(217,83,79,.45);color:#ef7f7b}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:18px;height:18px}
.ico.l{width:28px;height:28px}
/* landing */
.promo{border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(218,127,44,.22),rgba(218,127,44,.06));border:1px solid rgba(218,127,44,.5)}
.plazas{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.plazas i{height:10px;border-radius:3px;background:rgba(244,244,244,.12)}
.plazas i.on{background:var(--naranja)}
.pack{position:relative;border-radius:22px;padding:22px 20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pack.best{border-color:var(--naranja)}
.pack .ribbon{position:absolute;top:16px;right:16px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px}
.price b{font-size:46px;letter-spacing:-.03em;line-height:1}
.price s{color:var(--gris2);font-size:20px}
.price span{color:var(--gris);font-size:15px}
.feat{list-style:none;margin-top:16px;display:grid;gap:9px}
.feat li{display:flex;gap:10px;font-size:15px;color:#dcdde0}
.feat li svg{color:var(--naranja);margin-top:1px}
.steps3{display:grid;gap:10px}
.step3{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--carbon2);border:1px solid var(--line)}
.step3 .n{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--naranja);flex:none}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.team figure{border-radius:14px;overflow:hidden;background:#ddd}
.team img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.team figcaption{background:var(--card);padding:8px;font-size:12px;color:var(--gris)}
.team figcaption b{display:block;color:var(--blanco);font-size:13px}
.areas3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.areas3 div{padding:12px;border-radius:14px;background:var(--carbon2);border:1px solid var(--line);font-size:12.5px;color:var(--gris)}
.areas3 div b{display:flex;align-items:center;gap:6px;color:var(--blanco);font-size:15px;margin-bottom:4px}
.areas3 div.on{border-color:rgba(218,127,44,.6)}
/* forms */
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--gris);font-weight:600}
.inp{width:100%;min-height:52px;border-radius:14px;background:var(--carbon2);border:1px solid #2e2f35;padding:0 16px;font-size:16px;outline:none}
textarea.inp{padding:14px 16px;min-height:110px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--naranja)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:var(--carbon2);border:1px solid #2e2f35;font-size:14.5px;font-weight:600;color:#d6d7da}
.chip.on{background:rgba(218,127,44,.16);border-color:var(--naranja);color:var(--blanco)}
.opt{display:flex;gap:12px;padding:16px;border-radius:16px;background:var(--carbon2);border:1px solid #2e2f35;text-align:left;width:100%}
.opt.on{border-color:var(--naranja);background:rgba(218,127,44,.08)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #4a4b52;flex:none;margin-top:1px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--naranja)}
.opt.on .radio:after{content:'';width:10px;height:10px;border-radius:50%;background:var(--naranja)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;text-align:left;width:100%}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #4a4b52;flex:none;display:grid;place-items:center;transition:.15s}
.check.on .box{background:var(--naranja);border-color:var(--naranja);color:var(--carbon)}
.check.on .txt{color:var(--gris2);text-decoration:line-through}
.progress{display:flex;gap:6px;margin:6px 0 22px}
.progress i{flex:1;height:4px;border-radius:4px;background:#2b2c31}
.progress i.on{background:var(--naranja)}
/* client home */
.hero{position:relative;border-radius:24px;padding:20px;background:linear-gradient(160deg,#1f2024,#16171a);border:1px solid var(--line);overflow:hidden}
.hero .glow.o{width:220px;height:220px;right:-80px;bottom:-110px;opacity:.45}
.hero .glow.v{width:160px;height:160px;right:60px;bottom:-120px;opacity:.3}
.bigdate{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.bigdate .d{font-size:72px;font-weight:700;line-height:.85;letter-spacing:-.04em}
.bigdate .m{font-size:18px;font-weight:700;line-height:1.15}
.bigdate .m span{display:block;color:var(--gris);font-weight:400;font-size:15px}
.prep{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;background:var(--naranja);color:var(--carbon);text-align:left;margin-top:16px;position:relative;z-index:2}
.prep .ic{width:46px;height:46px;border-radius:14px;background:rgba(17,18,20,.14);display:grid;place-items:center;flex:none}
.prep b{font-size:15.5px;display:block;line-height:1.2;white-space:nowrap}
.prep small{font-size:13px;opacity:.8}
.ring{margin-left:auto;font-weight:700;font-size:13px;background:rgba(17,18,20,.16);padding:6px 9px;border-radius:10px}
/* calendar */
.cal{border-radius:24px;background:var(--card);border:1px solid var(--line);padding:18px 14px 14px;position:relative;overflow:hidden}
.cal-h{display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px 12px}
.cal-h .mo{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.cal-h .yr{font-size:14px;color:var(--gris2);font-weight:700;margin-left:6px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;border:1px solid var(--line)}
.cal-nav button[disabled]{opacity:.3}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{text-align:center;font-size:11px;color:var(--gris2);font-weight:700;padding:4px 0}
.day{position:relative;aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#55575e}
.day.av{color:var(--blanco);background:var(--carbon2);border:1px solid #34353b}
.day.av:after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--naranja)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--gris2);color:var(--blanco)}
.day.sel{background:var(--naranja);color:var(--carbon);border-color:var(--naranja)}
.day.sel:after{background:var(--carbon)}
.day.mine{background:var(--verde);color:var(--carbon);border-color:var(--verde)}
.day.mine:after{content:'';background:var(--carbon);width:14px;height:3px;border-radius:2px}
.day.full{color:#55575e;text-decoration:line-through}
.day.adm{color:#8a8d95;background:transparent;border:1px dashed #2e2f35}
.day.adm.open{background:rgba(218,127,44,.12);border:1px solid rgba(218,127,44,.55);color:var(--blanco)}
.day.adm .cnt{font-size:9.5px;font-weight:700;color:var(--verde);margin-top:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 6px 2px;font-size:12px;color:var(--gris)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.slots{display:grid;gap:8px;margin-top:14px}
.slot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--carbon2);border:1px solid #2e2f35;font-weight:700;font-size:16px}
.slot.on{border-color:var(--naranja);background:rgba(218,127,44,.12)}
.slot.off{opacity:.35;text-decoration:line-through;pointer-events:none}
/* month money */
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .l{display:flex;flex-direction:column}
.line .l small{color:var(--gris2);font-size:12.5px}
.line .r{font-weight:700;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:4px;background:var(--carbon2);border:1px solid #2e2f35;border-radius:12px;padding:3px}
.stepper button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--card2)}
.stepper b{min-width:24px;text-align:center}
.sum{border-radius:22px;padding:20px;background:var(--blanco);color:var(--carbon)}
.sum .eq{font-size:15px;color:#4a4c52;font-weight:600}
.sum .tot{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:6px}
.sum .sub{font-size:13px;color:#5c5f66;margin-top:6px}
.sum .btn.pp{margin-top:16px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.tile .ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--naranja)}
.tile .ic.v{color:var(--verde)}
.tile b{display:block;font-size:16px}
.tile small{color:var(--gris);font-size:13px}
.tile .chev{margin-left:auto;color:var(--gris2)}
.bar{height:8px;border-radius:8px;background:#2b2c31;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde);border-radius:8px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(17,18,20,0),var(--carbon) 30%)}
@media(min-width:500px){.nav{bottom:24px;border-radius:0 0 28px 28px}}
.nav-in{display:flex;justify-content:space-around;background:rgba(30,31,35,.94);backdrop-filter:blur(14px);border:1px solid #2c2d33;border-radius:22px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:700;color:var(--gris2);position:relative}
.nav button.on{color:var(--blanco);background:#2a2b31}
.nav button.on .ico{color:var(--naranja)}
.badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--naranja);color:var(--carbon);font-size:11px;display:grid;place-items:center;padding:0 5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.scrim.on{opacity:1}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:#18191c;border:1px solid #2c2d33;border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.scrim.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#3a3b41;margin:4px auto 14px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--blanco);color:var(--carbon);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;z-index:80;opacity:0;transition:.25s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.msg{max-width:82%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.4;background:var(--card2);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--naranja);color:var(--carbon);border-color:var(--naranja);border-bottom-right-radius:6px}
.msg.them{border-bottom-left-radius:6px}
.msg .who{font-size:11.5px;font-weight:700;color:var(--verde);margin-bottom:3px}
.msg .t{font-size:10.5px;opacity:.6;margin-top:4px;text-align:right}
.chatbar{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:8px 14px;z-index:25;display:flex;gap:8px;background:linear-gradient(rgba(17,18,20,0),var(--carbon) 35%)}
@media(min-width:500px){.chatbar{bottom:110px}}
.chatbar .inp{min-height:50px;border-radius:16px}
.chatbar button{width:50px;height:50px;border-radius:16px;background:var(--naranja);color:var(--carbon);display:grid;place-items:center;flex:none}
.avs{display:flex}
.avs img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--carbon);margin-left:-10px;background:#ddd}
.avs img:first-child{margin-left:0}
.av{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--naranja);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--gris2)}.kv dd{text-align:right;word-break:break-word}
.seg{display:flex;background:var(--carbon2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--gris)}
.seg button.on{background:var(--card2);color:var(--blanco)}
.demo-box{border:1px dashed #3a3b41;border-radius:16px;padding:14px;font-size:13.5px;color:var(--gris)}
.demo-box b{color:var(--blanco)}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid #2b2c31;border-top-color:var(--paypal);animation:sp 0.9s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.okc{width:72px;height:72px;border-radius:50%;background:var(--verde);color:var(--carbon);display:grid;place-items:center;margin:10px auto}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(218,127,44,.5)}50%{box-shadow:0 0 0 10px rgba(218,127,44,0)}}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 40px;position:relative}
.welcome .glow.o{width:340px;height:340px;right:-140px;bottom:120px;opacity:.5}
.welcome .glow.v{width:240px;height:240px;right:40px;bottom:40px;opacity:.35}
.sym{width:64px;opacity:.95}
.post{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.post .th{width:46px;height:58px;border-radius:9px;background:linear-gradient(160deg,#2a2b31,#1a1b1f);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--gris2);flex:none;border:1px solid var(--line)}
.post .th.r{background:linear-gradient(160deg,rgba(218,127,44,.35),#1a1b1f)}
.post .th.c{background:linear-gradient(160deg,rgba(128,168,168,.35),#1a1b1f)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.ninp{width:96px;min-height:44px;text-align:right;border-radius:12px;background:var(--carbon2);border:1px solid #2e2f35;padding:0 12px;outline:none}
.ninp:focus{border-color:var(--naranja)}
.sw{width:50px;height:30px;border-radius:30px;background:#3a3b41;position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--blanco);transition:.2s}
.sw.on{background:var(--naranja)}
.sw.on:after{left:23px}

/* ===== real-app additions ===== */
body{padding-top:env(safe-area-inset-top)}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.glow.drift{animation:drift 18s ease-in-out infinite alternate}
.glow.drift2{animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,-30px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-50px) scale(.9)}}
#splash{position:fixed;inset:0;z-index:200;background:var(--carbon);display:grid;place-items:center;transition:opacity .45s}
#splash img{width:84px;opacity:0;animation:sIn .35s .15s ease forwards}
#splash .glow.o{width:300px;height:300px;right:-120px;bottom:-60px;opacity:.45}
#splash .glow.v{width:220px;height:220px;right:40px;bottom:-120px;opacity:.3}
@keyframes sIn{to{opacity:1}}
#splash.out{opacity:0;pointer-events:none}
.stag>*{opacity:0;animation:fd .4s ease forwards}
.nostag .stag>*{animation:none;opacity:1}
.stag>*:nth-child(1){animation-delay:.02s}.stag>*:nth-child(2){animation-delay:.07s}.stag>*:nth-child(3){animation-delay:.12s}.stag>*:nth-child(4){animation-delay:.17s}.stag>*:nth-child(5){animation-delay:.22s}.stag>*:nth-child(6){animation-delay:.27s}.stag>*:nth-child(n+7){animation-delay:.3s}
/* landing hero */
.mega{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--naranja)}
.bigprice{display:flex;align-items:flex-start;gap:6px;margin-top:6px}
.bigprice b{font-size:112px;line-height:.82;letter-spacing:-.06em;font-weight:700}
.bigprice span{font-size:26px;font-weight:700;margin-top:6px}
.bigprice small{display:block;font-size:14px;color:var(--gris);font-weight:600;margin-top:2px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin:28px -20px 0;background:rgba(218,127,44,.06)}
.ticker div{display:inline-block;animation:tick 26s linear infinite;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#e6c7a8}
.ticker i{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--naranja);margin:0 14px 2px}
@keyframes tick{to{transform:translateX(-50%)}}
.slots10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.slots10 div{aspect-ratio:1;border-radius:14px;border:1px dashed #3a3b41;display:grid;place-items:center;font-weight:700;color:#55575e;font-size:15px;position:relative;overflow:hidden}
.slots10 div.on{border:1px solid var(--naranja);background:rgba(218,127,44,.16);color:var(--naranja2)}
.slots10 div.on:after{content:'';position:absolute;inset:auto 0 0 0;height:3px;background:var(--naranja)}
.photo-hero{position:relative;border-radius:22px;overflow:hidden;margin-top:24px}
.photo-hero img{width:100%;display:block;filter:grayscale(.15) contrast(1.05)}
.photo-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,18,20,0) 40%,rgba(17,18,20,.85))}
.photo-hero p{position:absolute;left:16px;bottom:14px;z-index:2;font-weight:700;font-size:15px}
/* ticket */
.ticket{position:relative;border-radius:24px;background:linear-gradient(150deg,#232428,#17181b 60%);border:1px solid #2e2f35;overflow:hidden}
.ticket .glow.o{width:240px;height:240px;right:-90px;top:-120px;opacity:.38}
.ticket .glow.v{width:160px;height:160px;right:40px;top:-110px;opacity:.25}
.ticket .tk-top{position:relative;z-index:2;padding:20px 20px 18px}
.ticket .tk-cut{position:relative;height:0;border-top:2px dashed #34353b;margin:0 22px}
.ticket .tk-cut:before,.ticket .tk-cut:after{content:'';position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--carbon);border:1px solid #2e2f35}
.ticket .tk-cut:before{left:-36px}.ticket .tk-cut:after{right:-36px}
.ticket .tk-bot{position:relative;z-index:2;padding:16px 20px 20px}
.tk-day{font-size:104px;font-weight:700;line-height:.8;letter-spacing:-.06em}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tk-meta div{font-size:12px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tk-meta b{display:block;color:var(--blanco);font-size:16px;letter-spacing:0;text-transform:none;margin-top:2px}
.barcode{height:34px;border-radius:4px;background:repeating-linear-gradient(90deg,#f4f4f4 0 2px,transparent 2px 4px,#f4f4f4 4px 5px,transparent 5px 8px,#f4f4f4 8px 11px,transparent 11px 12px);opacity:.85;flex:1}
.count{display:flex;gap:6px}
.count div{background:var(--carbon2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:46px}
.count b{display:block;font-size:18px;line-height:1}
.count small{font-size:10px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* chat */
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--gris2);text-transform:uppercase;letter-spacing:.08em;margin:6px 0}
.typing{display:inline-flex;gap:4px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gris);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.msg{animation:fd .25s ease both}
.msg .t .rd{font-weight:700;margin-left:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:9px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#d6d7da}
.chathead{display:flex;align-items:center;gap:12px}
.online{width:9px;height:9px;border-radius:50%;background:#5fbf8f;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(95,191,143,.15)}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.kpi b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12px;color:var(--gris);font-weight:600}
.kpi.o{border-color:rgba(218,127,44,.5);background:linear-gradient(150deg,rgba(218,127,44,.14),var(--card))}
.search{position:relative}.search .ico{position:absolute;left:14px;top:15px;color:var(--gris2)}.search .inp{padding-left:44px}
.loading{opacity:.55;pointer-events:none}
.pp-box{margin-top:16px;min-height:50px}
.testtag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:#5c5f66;background:#e7e7e7;border-radius:8px;padding:4px 8px}
.install{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px dashed rgba(218,127,44,.55);background:rgba(218,127,44,.06)}
.err{color:#ef7f7b;font-size:13.5px;min-height:18px;margin-top:8px}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const eur=n=>{n=Math.round(num(n)*100)/100;const d=Number.isInteger(n)?0:2;return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:2})+' €'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+n);return x};
const nice=s=>{const d=parse(s);return `${cap(DIA[d.getDay()])} ${d.getDate()} de ${MES[d.getMonth()]}`};
const short=s=>{const d=parse(s);return `${d.getDate()} ${MES[d.getMonth()].slice(0,3)}`};
const hhmm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayLabel=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);const diff=Math.round((TODAY-d)/864e5);return diff===0?'Hoy':diff===1?'Ayer':`${d.getDate()} de ${MES[d.getMonth()]}`};
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'');
const workMonth=()=>TODAY.getDate()>24?ym(addMonths(TODAY,1)):ym(TODAY);
const monthName=k=>MES[Number(k.slice(5,7))-1];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

async function loadSettings(){const{data,error}=await sb.from('settings').select('data').eq('id',1).single();if(error)throw error;D.settings=data.data}
async function loadMe(){const{data:{user}}=await sb.auth.getUser();if(!user){D.me=null;return}const{data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();D.me=data}
async function loadAll(){
  const today=iso(TODAY);
  const q=[
    sb.from('availability').select('*').gte('date',today),
    sb.from('bookings').select('*').order('date'),
    sb.from('extras').select('*'),
    sb.from('events').select('*').order('created_at',{ascending:false}),
    sb.from('payments').select('*').order('date',{ascending:false}),
    sb.from('messages').select('*').order('created_at').limit(2000),
    sb.rpc('taken_slots'),
  ];
  if(isAdmin())q.push(sb.from('profiles').select('*').order('created_at'));
  const r=await Promise.all(q);
  const err=r.find(x=>x.error);if(err)console.warn(err.error);
  D.availability={};(r[0].data||[]).forEach(a=>D.availability[a.date]=a.slots);
  D.bookings=r[1].data||[];D.extras=r[2].data||[];D.events=r[3].data||[];D.payments=r[4].data||[];D.messages=r[5].data||[];D.taken=r[6].data||[];
  if(isAdmin())D.profiles=r[7].data||[];
}
let rtChan=null,typeChan=null,reloadT=null;
function subscribeRealtime(){
  if(rtChan)sb.removeChannel(rtChan);
  rtChan=sb.channel('db-'+D.me.id);
  ['messages','events','bookings','availability','extras','payments','profiles','settings'].forEach(t=>{
    rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},p=>onChange(t,p));
  });
  rtChan.subscribe();
  subscribeTyping();
}
function subscribeTyping(){
  if(typeChan){sb.removeChannel(typeChan);typeChan=null}
  const room=isAdmin()?ui.chatWith:D.me.id;if(!room)return;
  typeChan=sb.channel('typing-'+room,{config:{broadcast:{self:false}}});
  typeChan.on('broadcast',{event:'typing'},({payload})=>{
    if(!!payload.team===isAdmin())return;
    ui.typing={who:payload.who,until:Date.now()+3500};showTyping();
    setTimeout(()=>{if(ui.typing&&Date.now()>ui.typing.until){ui.typing=null;showTyping()}},3700);
  }).subscribe();
}
let lastTypeSent=0;
function sendTyping(){if(!typeChan||Date.now()-lastTypeSent<1800)return;lastTypeSent=Date.now();typeChan.send({type:'broadcast',event:'typing',payload:{who:isAdmin()?myTeamName():(D.me.contact||'Cliente'),team:isAdmin()}})}
function showTyping(){const el=$('#typingSlot');if(!el)return;el.innerHTML=ui.typing?`<div class="typing"><i></i><i></i><i></i></div><div class="xs muted" style="margin-top:4px">${esc(ui.typing.who)} está escribiendo…</div>`:'';if(ui.typing)scrollChat()}
function onChange(t,p){
  if(t==='messages'&&p.eventType==='INSERT'){
    const m=p.new;if(!D.messages.some(x=>x.id===m.id))D.messages.push(m);
    const mine=m.sender_id===D.me.id;
    if(!mine){ui.typing=null;
      const inThread=(!isAdmin()&&ui.view==='client'&&ui.tab==='chat')||(isAdmin()&&ui.atab==='chat'&&ui.chatWith===m.client_id);
      if(inThread){sb.rpc('mark_read',{p_client:m.client_id})}
      else{const who=isAdmin()?(D.profiles.find(x=>x.id===m.client_id)?.business||'Cliente'):m.who;toast(`💬 ${who}: ${m.text.slice(0,60)}`);buzz();notify(who,m.text)}
    }
    softRender();return;
  }
  clearTimeout(reloadT);reloadT=setTimeout(async()=>{
    if(t==='settings'){await loadSettings()}
    else if(t==='profiles'){await loadMe();if(isAdmin()){const{data}=await sb.from('profiles').select('*').order('created_at');D.profiles=data||[]}}
    else await loadAll();
    softRender();
  },250);
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function notify(title,body){try{if(document.hidden&&'Notification'in window&&Notification.permission==='granted')new Notification(title,{body,icon:'icon-192.png'})}catch(e){}}

/* ================= RENDER ================= */
function render(keepScroll){
  const a=$('#app');const y=window.scrollY;
  // preserve inputs
  const keep={};['chatI','achatI','cq'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const focus=document.activeElement?.id;
  let h='';
  try{
    if(ui.view==='landing')h=vLanding();else if(ui.view==='welcome')h=vWelcome();else if(ui.view==='login')h=vLogin();
    else if(ui.view==='signup')h=vSignup();else if(ui.view==='client')h=vClient();else if(ui.view==='admin')h=vAdmin();
  }catch(e){console.error(e);h=`<div class="wrap"><p class="mt48">Algo ha fallado. <button class="link" onclick="location.reload()">Recargar</button></p></div>`}
  a.classList.toggle('nostag',!!keepScroll);
  a.innerHTML='<div class="grain"></div>'+h;
  Object.entries(keep).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v});
  if(focus){const el=document.getElementById(focus);if(el){el.focus();if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}}
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  afterRender();
}
function softRender(){if(document.querySelector('#scrim'))return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!['chatI','achatI','cq'].includes(ae.id))return;render(true)}
function go(v){ui.view=v;render()}
function afterRender(){
  if(isChatOpen()){scrollChat();showTyping();const cid=isAdmin()?ui.chatWith:D.me?.id;if(cid&&unreadFor(cid)>0)sb.rpc('mark_read',{p_client:cid}).then(()=>{D.messages.forEach(m=>{if(m.client_id===cid){if(isAdmin()&&!m.from_team)m.read_by_team=true;if(!isAdmin()&&m.from_team)m.read_by_client=true}})})}
  document.querySelectorAll('[data-count]').forEach(countUp);
  if($('#ppSignup'))mountPayPalSignup();
  if($('#ppExtras'))mountPayPalExtras();
  tickCountdown();
}
function isChatOpen(){return (ui.view==='client'&&ui.tab==='chat')||(ui.view==='admin'&&ui.atab==='chat'&&ui.chatWith)}
function scrollChat(){setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),20)}
function countUp(el){const to=num(el.dataset.count);const dur=550,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=eur(Math.round(to*e*100)/100);if(k<1)requestAnimationFrame(f);else el.textContent=eur(to)};requestAnimationFrame(f)}
let cdT=null;
function tickCountdown(){clearInterval(cdT);const el=$('#cd');if(!el)return;const target=new Date(el.dataset.t);const upd=()=>{const ms=target-new Date();if(ms<=0){el.innerHTML='<div><b>¡Hoy!</b><small>rodaje</small></div>';return}const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);el.innerHTML=`<div><b>${d}</b><small>días</small></div><div><b>${h}</b><small>horas</small></div><div><b>${m}</b><small>min</small></div>`};upd();cdT=setInterval(upd,30000)}

const ppLoaded={};

}

function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  if(!pushCapable()){toast('Este navegador no permite avisos');return}
  const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Has bloqueado los avisos. Actívalos en los ajustes del navegador.');return}
  try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(CFG.vapid)});
    const j=sub.toJSON();const{error}=await sb.from('push_subs').upsert({user_id:D.me.id,endpoint:j.endpoint,sub:j},{onConflict:'endpoint'});
    if(error)throw error;lsSet('lml-push',true);toast('Avisos activados ✓');render(true)}
  catch(e){console.warn(e);toast('No se han podido activar los avisos')}
}

    const{data,error}=await sb.functions.invoke('signup',{body:{form:{...d,accept:true},pack:ui.signup.pack,byTeam:true,custom}});const err=error?await errMsg(error):data?.error;el.classList.remove('loading');
    if(err){$('#merr').textContent=err;return}closeSheet(true);ui.signup=null;await loadAll();const{data:pr}=await sb.from('profiles').select('*').order('created_at');D.profiles=pr||[];render(true);toast(`Cuenta creada: ${data.username}`)},
  resetPw(el){sheet(`<span class="label g">Contraseña</span><h2 class="mt4">${esc(prof(el.dataset.id).business)}</h2><div class="field"><label>Nueva contraseña (mínimo 6)</label><input class="inp" id="npw" autocapitalize="none"></div><div class="err" id="perr"></div><button class="btn o mt16" id="pOk">Cambiar</button>`,d=>{d.querySelector('#pOk').onclick=async()=>{const pw=$('#npw').value;const{data,error}=await sb.functions.invoke('team',{body:{action:'reset_password',userId:el.dataset.id,password:pw}});const err=error?await errMsg(error):data?.error;if(err){$('#perr').textContent=err;return}closeSheet();toast('Contraseña cambiada. Pásasela al cliente.')}})},
  async delClient(el){if(!confirmTwice(el,'Se borra todo. Toca otra vez'))return;const{data,error}=await sb.functions.invoke('team',{body:{action:'delete_client',userId:el.dataset.id}});const err=error?await errMsg(error):data?.error;if(err)return toast(err);closeSheet(true);const{data:pr}=await sb.from('profiles').select('*').order('created_at');D.profiles=pr||[];await loadAll();render(true);toast('Cliente borrado')},
  newAdmin(){sheet(`<span class="label g">Equipo</span><h2 class="mt4">Nueva cuenta de equipo.</h2><div class="field"><label>Nombre</label><input class="inp" id="aN" placeholder="Ej. Bruno"></div><div class="field"><label>Usuario</label><input class="inp" id="aU" autocapitalize="none"></div><div class="field"><label>Contraseña (mínimo 6)</label><input class="inp" id="aP" autocapitalize="none"></div><div class="err" id="aerr"></div><button class="btn o mt16" id="aOk">Crear</button>`,d=>{d.querySelector('#aOk').onclick=async()=>{const{data,error}=await sb.functions.invoke('team',{body:{action:'create_admin',name:$('#aN').value,user:$('#aU').value,password:$('#aP').value}});const err=error?await errMsg(error):data?.error;if(err){$('#aerr').textContent=err;return}closeSheet();toast('Cuenta de equipo creada')}})},
};
function confirmTwice(el,msg){if(el.dataset.armed){return true}el.dataset.armed=1;toast(msg);setTimeout(()=>delete el.dataset.armed,3000);return false}
async function sendMsg(text,cid){const team=isAdmin();const row={client_id:team?cid:D.me.id,sender_id:D.me.id,from_team:team,who:team?myTeamName():(D.me.contact||'Cliente'),text};
  const tmp={...row,id:'tmp'+Date.now(),created_at:new Date().toISOString()};D.messages.push(tmp);if(isChatOpen())render(true);
  const{data,error}=await sb.from('messages').insert(row).select().single();
  D.messages=D.messages.filter(m=>m.id!==tmp.id);if(error){toast('No se ha enviado. Revisa tu conexión.');render(true);return}
  if(!D.messages.some(m=>m.id===data.id))D.messages.push(data);if(isChatOpen())render(true)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();Promise.resolve(f(el)).catch(err=>console.warn(err))}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.s&&ui.signup){ui.signup.data[t.dataset.s]=t.value;const b=document.querySelector('[data-act="sNext"]');if(b)b.disabled=!signupValid()}
  if(t.id==='chatI'||t.id==='achatI')sendTyping();
  if(t.id==='cq'){ui.q=t.value;clearTimeout(t._t);t._t=setTimeout(()=>render(true),250)}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.set){setPath(D.settings,t.dataset.set,parseFloat(t.value)||0);await saveSettings()}
  if(t.dataset.sett){setPath(D.settings,t.dataset.sett,t.value.trim());await saveSettings()}
  if(t.dataset.setlines){setPath(D.settings,t.dataset.setlines,t.value.split('\n').map(x=>x.trim()).filter(Boolean));await saveSettings()}
  if(t.dataset.cprice){await upd('profiles',{price:parseFloat(t.value)||0},{id:t.dataset.cprice});prof(t.dataset.cprice).price=parseFloat(t.value)||0;toast('Precio del cliente actualizado')}
  if(t.dataset.cextra!==undefined){const v=t.value===''?null:parseFloat(t.value);await upd('profiles',{extra_day_price:v},{id:t.dataset.cextra});prof(t.dataset.cextra).extra_day_price=v;toast('Precio del día extra guardado')}
  if(t.dataset.civa){const v=parseFloat(t.value)||0;await upd('profiles',{iva_pct:v},{id:t.dataset.civa});prof(t.dataset.civa).iva_pct=v;toast('IVA guardado')}
  if(t.dataset.cpackname!==undefined||t.dataset.cpackfeat!==undefined){const id=t.dataset.cpackname||t.dataset.cpackfeat,sc=$('#scrim');const name=sc.querySelector('[data-cpackname]').value.trim(),feats=sc.querySelector('[data-cpackfeat]').value.split('\n').map(x=>x.trim()).filter(Boolean);const cp=name?{name,features:feats}:null;await upd('profiles',{custom_pack:cp},{id});prof(id).custom_pack=cp;toast(cp?'Paquete a medida guardado':'Vuelve al pack normal')}
  if(t.dataset.cmins){await upd('profiles',{mins:parseInt(t.value)||0},{id:t.dataset.cmins});toast('Guardado')}
  if(t.dataset.cscripts){const sc=t.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);await upd('profiles',{scripts:sc},{id:t.dataset.cscripts});prof(t.dataset.cscripts).scripts=sc;toast('Guiones guardados')}
});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='loginF')doLogin($('#lu').value,$('#lp').value);
  if(f.id==='chatF'){const i=$('#chatI'),v=i.value.trim();if(!v)return;i.value='';await sendMsg(v)}
  if(f.id==='achatF'){const i=$('#achatI'),v=i.value.trim();if(!v)return;i.value='';await sendMsg(v,ui.chatWith)}
});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&D.me){await loadAll();softRender()}});

/* ================= BOOT ================= */
(async()=>{
  const t0=Date.now();
  try{await loadSettings();const{data:{session}}=await sb.auth.getSession();if(session){await loadMe();if(D.me){ui.view='welcome'}else{await sb.auth.signOut();ui.view='landing'}}else ui.view='landing'}
  catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="wrap"><h2 class="mt48">Sin conexión</h2><p class="muted mt8">Revisa tu internet y vuelve a abrir la app.</p><button class="btn o mt24" onclick="location.reload()">Reintentar</button></div>'}
  const wait=Math.max(0,900-(Date.now()-t0));
  setTimeout(()=>{if(ui.view!=='boot')render();const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),500)},wait);
})();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
