# Hace una consulta a la base de datos cada 2 días para que Supabase (plan gratis) no la pause por inactividad.
name: Mantener activa la base de datos
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        run: |
          curl -fsS "https://ugwzbcrvamfpxpcfldag.supabase.co/rest/v1/settings?select=updated_at" \
            -H "apikey: sb_publishable_wmWK1Sf80TjARF-I5RuZYA_Qpd_cPk_" > /dev/null
          echo "Base de datos activa"
